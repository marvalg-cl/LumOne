        </div></div>
      </div>
    </div>
  `;
}

function renderRfqItemsTable(){
  const wrap = document.getElementById("rfqItemsWrap");
  wrap.innerHTML = `
    <table class="items-table">
      <thead><tr><th>Producto</th><th>Unidad</th><th>Cantidad</th><th></th></tr></thead>
      <tbody>
        ${draftRfqItems.map((it,i)=>{
          const esManual = !it.productId;
          return `
          <tr data-idx="${i}">
            <td>
              <select class="rfq-item-product">
                <option value="" ${esManual?"selected":""}>✏️ Escribir manualmente...</option>
                ${DATA.products.map(p=>`<option value="${p.id}" ${p.id===it.productId?"selected":""}>${esc(p.nombre)}</option>`).join("")}
              </select>
              ${esManual?`<input type="text" class="rfq-item-nombre" value="${esc(it.nombre)}" placeholder="Nombre del producto" style="margin-top:6px;min-width:200px;"/>`:''}
            </td>
            <td>${esManual?`<input type="text" class="rfq-item-unidad" value="${esc(it.unidad)}" placeholder="BR, SC, M3..." style="width:80px;"/>`:`<span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;">${esc(it.unidad)}</span>`}</td>
            <td><input type="number" class="rfq-item-cantidad" min="0" value="${it.cantidad}" style="width:80px;"/></td>
            <td><button class="icon-btn rfq-item-remove" title="Quitar">${ICONS.trash}</button></td>
          </tr>
        `;
        }).join("")}
      </tbody>
    </table>
    <div class="hint" style="margin-top:6px;">Elige un producto de tu catálogo (autocompleta la unidad) o escribe uno manualmente si aún no lo tienes registrado.</div>
  `;
  wrap.querySelectorAll("tbody tr").forEach(tr=>{
    const idx = Number(tr.dataset.idx);
    tr.querySelector(".rfq-item-product").addEventListener("change",(e)=>{
      const productId = e.target.value;
      if(productId){
        const existingIdx = draftRfqItems.findIndex((x,i)=> i!==idx && x.productId===productId);
        if(existingIdx !== -1){
          const qtyToAdd = Number(draftRfqItems[idx].cantidad)||1;
          draftRfqItems[existingIdx].cantidad = (Number(draftRfqItems[existingIdx].cantidad)||0) + qtyToAdd;
          draftRfqItems.splice(idx,1);
          showToast("Ese producto ya estaba en la lista — cantidades sumadas.");
        }else{
          const prod = DATA.products.find(p=>p.id===productId);
          draftRfqItems[idx].productId = productId;
          draftRfqItems[idx].nombre = prod.nombre;
          draftRfqItems[idx].unidad = unitLabel(prod);
        }
      }else{
        draftRfqItems[idx].productId = "";
        draftRfqItems[idx].nombre = "";
        draftRfqItems[idx].unidad = "";
      }
      renderRfqItemsTable();
    });
    const nombreInput = tr.querySelector(".rfq-item-nombre");
    if(nombreInput) nombreInput.addEventListener("input",(e)=>{ draftRfqItems[idx].nombre = e.target.value; });
    const unidadInput = tr.querySelector(".rfq-item-unidad");
    if(unidadInput) unidadInput.addEventListener("input",(e)=>{ draftRfqItems[idx].unidad = e.target.value; });
    tr.querySelector(".rfq-item-cantidad").addEventListener("input",(e)=>{ draftRfqItems[idx].cantidad = e.target.value; });
    tr.querySelector(".rfq-item-remove").addEventListener("click",()=>{
      draftRfqItems.splice(idx,1);
      if(draftRfqItems.length===0) draftRfqItems.push({ productId:"", nombre:"", unidad:"", cantidad:1 });
      renderRfqItemsTable();
    });
  });
}

function openRfqBuilder(existingRfq){
  const isEdit = !!existingRfq;
  document.body.insertAdjacentHTML("beforeend", rfqBuilderModal(existingRfq));
  renderRfqItemsTable();
  wireModalClose();
  document.getElementById("addRfqItemBtn").addEventListener("click",()=>{
    draftRfqItems.push({ productId:"", nombre:"", unidad:"", cantidad:1 });
    renderRfqItemsTable();
  });
  const rfqSupplierSearch = document.getElementById("rfq-supplierSearch");
  if(rfqSupplierSearch) rfqSupplierSearch.addEventListener("input", ()=>{
    const q = rfqSupplierSearch.value.trim().toLowerCase();
    document.querySelectorAll("#rfqSupplierList .checklist-item").forEach(item=>{
      const label = item.querySelector("label");
      const match = !q || (label?label.textContent.toLowerCase():"").includes(q);
      item.style.display = match ? "" : "none";
    });
  });
  document.getElementById("saveRfq").onclick = ()=>{
    const validItems = draftRfqItems.filter(it=>it.nombre.trim());
    if(validItems.length===0){ showToast("Agrega al menos un producto."); return; }
    const selectedSuppliers = Array.from(document.querySelectorAll(".rfq-supplier-check:checked")).map(el=>el.value);
    if(selectedSuppliers.length===0){ showToast("Selecciona al menos un proveedor."); return; }
    const items = validItems.map(it=>({ productId: it.productId||"", nombre: it.nombre.trim(), unidad: (it.unidad||"").trim(), cantidad: Number(it.cantidad)||0 }));
    const notas = document.getElementById("rfq-notas").value.trim();
    if(isEdit){
      const oldRecipients = existingRfq.recipients;
      existingRfq.items = items;
      existingRfq.notas = notas;
      existingRfq.recipients = selectedSuppliers.map(id=>{
        const prev = oldRecipients.find(r=>r.supplierId===id);
        return prev || { supplierId:id, estado:"pendiente", enviadoEn:null };
      });
      saveData(DATA); closeModal(); render();
      showToast(`Solicitud ${existingRfq.folio} actualizada.`);
      openRfqView(existingRfq.id);
    }else{
      const folio = DATA.settings.folioPrefijoSolicitud + "-" + String(DATA.nextRfqFolio).padStart(4,"0");
      const rfq = {
        id: uid("r"), folio,
        fecha: new Date().toISOString(),
        notas, items,
        recipients: selectedSuppliers.map(id=>({ supplierId:id, estado:"pendiente", enviadoEn:null })),
      };
      DATA.rfqs.push(rfq);
      DATA.nextRfqFolio += 1;
      saveData(DATA); closeModal(); render();
      showToast(`Solicitud ${folio} creada.`);
      openRfqView(rfq.id);
    }
  };
}

function printRfq(rfqId){
  const r = DATA.rfqs.find(x=>x.id===rfqId);
  if(!r) return;
  document.getElementById("printArea").innerHTML = renderRfqDocHTML(r, null, true);
  window.print();
}

function renderRfqDocHTML(r, supplier, forPrint){
  const itemsRows = r.items.map(it=>`<tr><td>${esc(it.nombre)}</td><td class="num">${it.cantidad} ${esc(it.unidad||"")}</td></tr>`).join("");
  return `
    <div class="${forPrint?"doc":""}" style="${forPrint?"":"border:1px solid var(--border-soft);border-radius:10px;padding:24px;margin-top:16px;background:#fff;"}">

async function downloadRfqPDF(r, supplier){
  if(typeof window.jspdf === "undefined"){
    showToast("No se pudo cargar el generador de PDF (requiere internet la primera vez).");
    return;
  }
  showToast("Generando PDF…");
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","pt","letter");
    const marginPt = 40;
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    let y = pdfHeader(pdf, marginPt, pageW, r.folio, [`Fecha: ${fmtDate(r.fecha)}`, "Solicitud de cotización"]);

    const supContact = supplier ? DATA.contacts.find(x=>x.id===supplier.contactoPrincipalId) : null;
    const lines = [`Estimado/a ${supplier ? (supContact?supContact.nombre:supplier.nombre) : "proveedor"},`];
    if(supContact) lines.push(`Contacto: ${supContact.nombre}${supContact.cargo?` (${supContact.cargo})`:""}${supContact.celular||supContact.whatsapp?` · Cel/WhatsApp: ${supContact.celular||supContact.whatsapp}`:""}${supContact.correo?` · ${supContact.correo}`:""}`);
    lines.push("Agradeceríamos nos coticen los siguientes productos, indicando precio, plazo de entrega y condiciones de pago.");
    y = pdfInfoBox(pdf, marginPt, pageW, y, { lines, accent: PDF_C.teal });

    const body = r.items.map(it=>[it.nombre, `${it.cantidad} ${it.unidad||""}`.trim()]);
    y = pdfItemsTable(pdf, marginPt, y, ["Producto / descripción","Cantidad"], body, [1]);

    if(r.notas){
      pdfFont(pdf, "bold", 9.3, PDF_C.text);
      pdf.text("Notas:", marginPt, y);
      pdfFont(pdf, "normal", 9.3, PDF_C.muted);
      pdf.text(pdf.splitTextToSize(r.notas, pageW - marginPt*2 - 40), marginPt+40, y);
    }

    pdfFooter(pdf, pageW, pageH, "Lumobral · Solicitud de cotización generada automáticamente");
    pdf.save(`${r.folio}-${(supplier?supplier.nombre:'proveedor').replace(/[^a-z0-9]+/gi,'-')}.pdf`);
  }catch(err){
    console.error(err);
    showToast("No se pudo generar el PDF automáticamente.");
  }
}

function openRfqView(rfqId){
  const r = DATA.rfqs.find(x=>x.id===rfqId);
  if(!r) return;
  document.body.insertAdjacentHTML("beforeend", `
    <div class="overlay" id="overlay">
      <div class="modal wide">
        <div class="modal-head"><div class="modal-title">${esc(r.folio)}</div><button class="modal-close" id="closeModal">${ICONS.close}</button></div>
        <div class="modal-body">
          <table class="items-table">
            <thead><tr><th>Producto</th><th>Unidad</th><th>Cantidad</th></tr></thead>
            <tbody>${r.items.map(it=>`<tr><td>${esc(it.nombre)}</td><td>${esc(it.unidad)}</td><td>${it.cantidad}</td></tr>`).join("")}</tbody>
          </table>
          ${r.notas?`<div class="hint" style="margin-top:8px;">Notas: ${esc(r.notas)}</div>`:''}

          <div class="field-label" style="margin-top:20px;margin-bottom:8px;">Enviar a cada proveedor (por separado)</div>
          <div style="display:flex;flex-direction:column;gap:8px;" id="rfqRecipients"></div>
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;">
          <button class="btn-danger-text" id="rv-delete">${ICONS.trash} Eliminar solicitud</button>
          <div class="right">
            <button class="btn btn-ghost btn-sm" id="rv-edit">${ICONS.edit} Editar</button>
            <button class="btn btn-ghost btn-sm" id="rv-print">${ICONS.print} Imprimir</button>
          </div>
        </div>
      </div>
    </div>
  `);
  wireModalClose();
  renderRfqRecipients(r);
  document.getElementById("rv-edit").onclick = ()=>{ closeModal(); openRfqBuilder(r); };
  document.getElementById("rv-print").onclick = ()=> printRfq(r.id);
  document.getElementById("rv-delete").onclick = ()=>{
    if(confirm("¿Eliminar esta solicitud?")){
      DATA.rfqs = DATA.rfqs.filter(x=>x.id!==rfqId);
      saveData(DATA); closeModal(); render(); showToast("Solicitud eliminada.");
    }
  };
}

function renderRfqRecipients(r){
  const wrap = document.getElementById("rfqRecipients");
  const precios = r.recipients.filter(rec=> rec.respuesta && rec.respuesta.precioTotal>0).map(rec=>rec.respuesta.precioTotal);
  const mejorPrecio = precios.length ? Math.min(...precios) : null;

  wrap.innerHTML = r.recipients.map(rec=>{
    const s = DATA.suppliers.find(x=>x.id===rec.supplierId);
    const contacto = s ? DATA.contacts.find(x=>x.id===s.contactoPrincipalId) : null;
    const estadoLabel = { pendiente:"Pendiente", enviado_correo:"Enviado por correo", enviado_whatsapp:"Enviado por WhatsApp", cotizado:"Cotizó", rechazado:"No cotiza" }[rec.estado] || rec.estado;
    const resp = rec.respuesta;
    const esMejor = resp && resp.precioTotal===mejorPrecio && mejorPrecio!==null;
    return `
      <div class="recipient-row" data-supplier="${rec.supplierId}" style="flex-wrap:wrap;${esMejor?'border-color:#1F7A4D;background:#F3FBF6;':''}">
        <div class="recipient-name">${esc(s?s.nombre:"Proveedor eliminado")} ${contacto?`<span class="recipient-sub">· ${esc(contacto.nombre)}</span>`:''}</div>
        <span class="badge badge-${rec.estado}">${estadoLabel}</span>
        ${esMejor?'<span class="badge" style="background:#1F7A4D;color:#fff;">★ Mejor precio</span>':''}
        <button class="btn btn-ghost btn-sm rfq-send-email">${ICONS.mail} Correo</button>
        <button class="btn btn-ghost btn-sm rfq-send-whatsapp">${ICONS.whatsapp} WhatsApp</button>
        <button class="btn btn-ghost btn-sm rfq-register-quote">${ICONS.edit} ${resp?'Editar cotización':'Registrar cotización'}</button>
        ${resp && !resp.rechazado ? `<button class="btn btn-primary btn-sm rfq-generate-po">${ICONS.pedidos} Generar Orden de Compra</button>` : ''}
        ${resp ? `
          <div style="width:100%;display:flex;gap:16px;flex-wrap:wrap;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);padding:6px 2px 2px;">
            ${resp.rechazado ? `<span style="color:var(--danger);">No cotiza / rechazó la solicitud${resp.condiciones?': '+esc(resp.condiciones):''}</span>` : `
              <span><b style="color:var(--text);">${fmt(resp.precioTotal)}</b></span>
              ${resp.plazoEntregaDias?`<span>Entrega: ${resp.plazoEntregaDias} días</span>`:''}
              ${resp.vigenciaDias?`<span>Vigencia: ${resp.vigenciaDias} días</span>`:''}
              ${resp.condiciones?`<span>${esc(resp.condiciones)}</span>`:''}
            `}
          </div>
        ` : ''}
      </div>
    `;
  }).join("");

  wrap.querySelectorAll(".recipient-row").forEach(row=>{
    const supplierId = row.dataset.supplier;
    const rec = r.recipients.find(x=>x.supplierId===supplierId);
    const s = DATA.suppliers.find(x=>x.id===supplierId);
    const contacto = s ? DATA.contacts.find(x=>x.id===s.contactoPrincipalId) : null;
    const nombreDestino = contacto ? contacto.nombre : (s ? s.nombre : "");

    row.querySelector(".rfq-send-email").onclick = async ()=>{
      let correo = contacto && contacto.correo;
      if(!correo){ correo = window.prompt("No hay correo guardado para este proveedor. Escribe el correo de destino:", ""); if(!correo) return; }
      showToast("Descargando PDF... adjúntalo en el correo que se abrirá.");
      await downloadRfqPDF(r, s);
      setTimeout(()=>{
        const subject = encodeURIComponent('Solicitud de cotización '+r.folio+' — Lumobral');
        const body = encodeURIComponent('Estimado/a '+nombreDestino+',\n\nLes agradeceríamos cotizar los productos adjuntos (PDF «'+r.folio+'» que se acaba de descargar) indicando precio, plazo de entrega y condiciones de pago.\n\nSaludos,\nLumobral');

/* ---------------- órdenes de compra ---------------- */

let poQuery = "";
let draftPoItems = [];

function poTotal(po){ return (po.items||[]).reduce((sum,it)=> sum + (Number(it.cantidad)||0)*(Number(it.precioUnitario)||0), 0); }
function poPagado(po){ return (po.pagos||[]).reduce((sum,p)=> sum + (Number(p.monto)||0), 0); }
function poNotasCreditoTotal(po){ return (po.notasCredito||[]).reduce((sum,n)=> sum + (Number(n.monto)||0), 0); }
function poSaldo(po){ return Math.max(0, poTotal(po) - poPagado(po) - poNotasCreditoTotal(po)); }
function quoteCobrado(q){ return (q.pagos||[]).reduce((sum,p)=> sum + (Number(p.monto)||0), 0); }
function quoteNotasCreditoTotal(q){ return (q.notasCredito||[]).reduce((sum,n)=> sum + (Number(n.monto)||0), 0); }
function quoteSaldo(q){ return Math.max(0, (Number(q.total)||0) - quoteCobrado(q) - quoteNotasCreditoTotal(q)); }

function createPurchaseOrderFromRfq(r, rec){
  const s = DATA.suppliers.find(x=>x.id===rec.supplierId);
  if(!s){ showToast("Ese proveedor ya no existe."); return; }
  const totalCantidad = r.items.reduce((sum,it)=> sum + (Number(it.cantidad)||0), 0) || 1;
  const precioTotal = (rec.respuesta && rec.respuesta.precioTotal) || 0;
  const items = r.items.map(it=>({
    productId: it.productId||"", nombre: it.nombre, unidad: it.unidad,
    cantidad: Number(it.cantidad)||0,
    precioUnitario: precioTotal>0 ? Math.round((precioTotal/totalCantidad)) : 0,
    cantidadRecibida: 0,
  }));
  const notas = (rec.respuesta && rec.respuesta.condiciones) ? `Condiciones cotizadas: ${rec.respuesta.condiciones}` : "";
  openPurchaseOrderModal(null, { supplierId: s.id, items, notas, rfqId: r.id });
}

  const filtered = DATA.purchaseOrders.filter(po=>{

  return `

      renderPoItemsTable();
    });
  });
}

function poNextActions(po){
  const actions = [];
  if(po.estado==="borrador") actions.push({ id:"solicitar_aprobacion", label:"Enviar a aprobación", cls:"btn-primary" });
  if(po.estado==="pendiente_aprobacion") actions.push({ id:"aprobar", label:`${ICONS.check||''} Aprobar`, cls:"btn-primary" }, { id:"rechazar_aprobacion", label:"Devolver a borrador", cls:"btn-ghost" });
  if(po.estado==="aprobada") actions.push({ id:"marcar_enviada", label:"Marcar como enviada al proveedor", cls:"btn-primary" });
  if(po.estado==="enviada") actions.push({ id:"marcar_confirmada", label:"Proveedor confirmó la orden", cls:"btn-primary" });
  if(["confirmada","recepcion_parcial"].includes(po.estado)) actions.push({ id:"marcar_recibida", label:"Marcar recepción completa", cls:"btn-primary" });
  if(po.estado==="recibida") actions.push({ id:"cerrar", label:"Cerrar orden", cls:"btn-primary" });
  if(!["cerrada","cancelada"].includes(po.estado)) actions.push({ id:"cancelar", label:"Cancelar orden", cls:"btn-danger-text" });
  return actions;
}

                <td>${esc(it.nombre)}</td>
                <td>${it.cantidad} ${esc(it.unidad||"")}</td>
                <td>${fmt(it.precioUnitario)}</td>
                <td>${fmt((Number(it.cantidad)||0)*(Number(it.precioUnitario)||0))}</td>
                ${["enviada","confirmada","recepcion_parcial","recibida"].includes(po.estado)?`<td><input type="number" class="po-recibido-input" data-idx="${i}" min="0" max="${it.cantidad}" value="${it.cantidadRecibida||0}" style="width:70px;"/></td>`:''}
              </tr>
            `).join("")}</tbody>
            <tfoot><tr><td colspan="3" style="text-align:right;font-weight:700;">Total</td><td style="font-weight:700;">${fmt(poTotal(po))}</td>${["enviada","confirmada","recepcion_parcial","recibida"].includes(po.estado)?'<td></td>':''}</tr></tfoot>
          </table>
          ${["enviada","confirmada","recepcion_parcial","recibida"].includes(po.estado)?`<button class="btn btn-ghost btn-sm" id="po-save-recepcion" style="margin-top:8px;">${ICONS.edit} Guardar cantidades recibidas</button>`:''}
          ${po.notas?`<div class="hint" style="margin-top:12px;">Notas: ${esc(po.notas)}</div>`:''}
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;flex-wrap:wrap;gap:8px;">
          <button class="btn-danger-text" id="pov-delete" ${po.estado!=="borrador"?"disabled style=\"opacity:.35;cursor:not-allowed;\"":""}>${ICONS.trash} Eliminar</button>
          <div class="right" style="flex-wrap:wrap;gap:8px;">
            ${po.estado==="borrador"?`<button class="btn btn-ghost btn-sm" id="pov-edit">${ICONS.edit} Editar</button>`:''}
            ${po.estado!=="borrador"?`<button class="btn btn-ghost btn-sm" id="pov-print">${ICONS.print} Imprimir / PDF</button>`:''}
            ${["aprobada","enviada","confirmada","recepcion_parcial","recibida"].includes(po.estado)?`
              <button class="btn btn-ghost btn-sm" id="pov-send-email">${ICONS.mail} Correo</button>
              <button class="btn btn-ghost btn-sm" id="pov-send-whatsapp">${ICONS.whatsapp} WhatsApp</button>
            `:''}
            ${actions.map(a=>`<button class="btn ${a.cls} btn-sm" data-po-action="${a.id}">${a.label}</button>`).join("")}
          </div>
        </div>
      </div>
    </div>
  `);
  wireModalClose();

  const recepcionBtn = document.getElementById("po-save-recepcion");
  if(recepcionBtn) recepcionBtn.onclick = ()=>{
    document.querySelectorAll(".po-recibido-input").forEach(inp=>{
      const idx = Number(inp.dataset.idx);
      const nuevaCantidad = Math.max(0, Math.min(Number(inp.value)||0, po.items[idx].cantidad));
      const anterior = Number(po.items[idx].cantidadRecibida)||0;
      const delta = nuevaCantidad - anterior;
      if(delta!==0 && po.items[idx].productId){
        const prod = DATA.products.find(p=>p.id===po.items[idx].productId);
        if(prod){ prod.stock = Math.max(0, (Number(prod.stock)||0) + delta); registrarMovimientoStock(prod, delta, `Recepción parcial OC ${po.folio}`); }
      }
      po.items[idx].cantidadRecibida = nuevaCantidad;
    });
    const totalPedido = po.items.reduce((s,it)=>s+Number(it.cantidad||0),0);
    const totalRecibido = po.items.reduce((s,it)=>s+Number(it.cantidadRecibida||0),0);
    if(totalRecibido<=0) { /* sin cambios de estado */ }
    else if(totalRecibido >= totalPedido) po.estado = "recibida";
    else po.estado = "recepcion_parcial";
    saveData(DATA); closeModal(); render(); openPurchaseOrderView(po.id);
    showToast("Recepción registrada. El stock de los productos vinculados ya se actualizó.");
  };

  const editBtn = document.getElementById("pov-edit");
  if(editBtn) editBtn.onclick = ()=>{ closeModal(); openPurchaseOrderModal(po); };
  const printBtn = document.getElementById("pov-print");
  if(printBtn) printBtn.onclick = ()=> printPurchaseOrder(po.id);
  const deleteBtn = document.getElementById("pov-delete");
  if(deleteBtn && po.estado==="borrador") deleteBtn.onclick = ()=>{
    if(confirm("¿Eliminar esta orden de compra?")){
      DATA.purchaseOrders = DATA.purchaseOrders.filter(x=>x.id!==poId);
      saveData(DATA); closeModal(); render(); showToast("Orden de compra eliminada.");
    }
  };

  const sendEmailBtn = document.getElementById("pov-send-email");
  if(sendEmailBtn) sendEmailBtn.onclick = async ()=>{
    let correo = contacto && contacto.correo;
    if(!correo){ correo = window.prompt("No hay correo guardado para este proveedor. Escribe el correo de destino:", ""); if(!correo) return; }
    showToast("Descargando PDF... adjúntalo en el correo que se abrirá.");
    await downloadPurchaseOrderPDF(po, s);
    setTimeout(()=>{
      const subject = encodeURIComponent('Orden de Compra '+po.folio+' — Lumobral');
      const body = encodeURIComponent('Estimado/a '+(contacto?contacto.nombre:s.nombre)+',\n\nAdjuntamos nuestra orden de compra «'+po.folio+'» (PDF que se acaba de descargar).\n\nSaludos,\nLumobral');
      window.location.href = `mailto:${esc(correo)}?subject=${subject}&body=${body}`;
    }, 900);
    if(po.estado==="aprobada"){ po.estado="enviada"; saveData(DATA); render(); }
  };
  const sendWaBtn = document.getElementById("pov-send-whatsapp");
  if(sendWaBtn) sendWaBtn.onclick = async ()=>{
    let whatsapp = contacto && contacto.whatsapp;
    if(!whatsapp){ whatsapp = window.prompt("No hay WhatsApp guardado para este proveedor. Escribe el número (con código de país):", ""); if(!whatsapp) return; }
    showToast("Descargando PDF... adjúntalo en la conversación de WhatsApp.");
    await downloadPurchaseOrderPDF(po, s);
    setTimeout(()=>{
      const text = encodeURIComponent('Hola '+(contacto?contacto.nombre:s.nombre)+', te compartimos nuestra orden de compra '+po.folio+'. Te acabo de descargar el PDF con el detalle — lo adjunto aquí mismo.');
      window.open(`https://wa.me/${onlyDigits(whatsapp)}?text=${text}`, '_blank');
    }, 900);
    if(po.estado==="aprobada"){ po.estado="enviada"; saveData(DATA); render(); }
  };

  document.querySelectorAll("[data-po-action]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const action = btn.dataset.poAction;
      if(action==="solicitar_aprobacion") po.estado = "pendiente_aprobacion";
      if(action==="aprobar"){
        if(po.quoteId && DATA.settings.anticipoMinimoPct>0){
          const quote = DATA.quotes.find(x=>x.id===po.quoteId);
          if(quote){
            const pctCobrado = quote.total>0 ? (quoteCobrado(quote)/quote.total)*100 : 0;
            if(pctCobrado < DATA.settings.anticipoMinimoPct){
              const forzar = window.confirm(`El cliente solo ha pagado ${pctCobrado.toFixed(0)}% de ${esc(quote.folio)} (se requiere ${DATA.settings.anticipoMinimoPct}%).\n\n¿Aprobar de todas formas? (requiere autorización de un supervisor)`);
              if(!forzar) return;
            }
          }
        }
        po.estado = "aprobada"; po.aprobadaEn = new Date().toISOString();
      }
      if(action==="rechazar_aprobacion") po.estado = "borrador";
      if(action==="marcar_enviada") po.estado = "enviada";
      if(action==="marcar_confirmada") po.estado = "confirmada";
      if(action==="marcar_recibida"){
        po.estado = "recibida";
        po.items.forEach(it=>{
          const delta = (Number(it.cantidad)||0) - (Number(it.cantidadRecibida)||0);
          if(delta!==0 && it.productId){
            const prod = DATA.products.find(p=>p.id===it.productId);
            if(prod){ prod.stock = Math.max(0, (Number(prod.stock)||0) + delta); registrarMovimientoStock(prod, delta, `Recepción OC ${po.folio}`); }
          }
          it.cantidadRecibida = it.cantidad;
        });
      }
      if(action==="cerrar") po.estado = "cerrada";
      if(action==="cancelar"){ if(!window.confirm("¿Cancelar esta orden de compra?")) return; po.estado = "cancelada"; }
      saveData(DATA); closeModal(); render(); openPurchaseOrderView(po.id);
    });
  });
}

async function downloadPurchaseOrderPDF(po, supplier){
  if(typeof window.jspdf === "undefined"){
    showToast("No se pudo cargar el generador de PDF (requiere internet la primera vez).");
    return;
  }
  showToast("Generando PDF…");
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","pt","letter");
    const marginPt = 40;
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    let y = pdfHeader(pdf, marginPt, pageW, po.folio, [`Fecha: ${fmtDate(po.fecha)}`, "Orden de Compra"]);

    y = pdfInfoBox(pdf, marginPt, pageW, y, {
      lines: [`Proveedor: ${supplier?supplier.nombre:""}${supplier&&supplier.rut?` · RUT ${supplier.rut}`:""}`],
      accent: PDF_C.teal,
    });

    const body = po.items.map(it=>[it.nombre, `${it.cantidad} ${it.unidad||""}`.trim(), fmt(it.precioUnitario), fmt((Number(it.cantidad)||0)*(Number(it.precioUnitario)||0))]);
    y = pdfItemsTable(pdf, marginPt, y, ["Producto / descripción","Cantidad","Precio unit.","Subtotal"], body, [1,2,3]);

    y = pdfTotals(pdf, marginPt, pageW, y, [], { label:"Total", value: fmt(poTotal(po)) });

    if(po.notas){
      pdfFont(pdf, "bold", 9.3, PDF_C.text);
      pdf.text("Notas:", marginPt, y);
      pdfFont(pdf, "normal", 9.3, PDF_C.muted);
      pdf.text(pdf.splitTextToSize(po.notas, pageW - marginPt*2 - 40), marginPt+40, y);
    }

    pdfFooter(pdf, pageW, pageH, `${DATA.settings.razonSocial} · Orden de Compra generada automáticamente`);
    pdf.save(`${po.folio}-${(supplier?supplier.nombre:'proveedor').replace(/[^a-z0-9]+/gi,'-')}.pdf`);
  }catch(err){
    console.error(err);
    showToast("No se pudo generar el PDF automáticamente.");
  }
}

function printPurchaseOrder(poId){
  const po = DATA.purchaseOrders.find(x=>x.id===poId);
  if(!po) return;
  const s = DATA.suppliers.find(x=>x.id===po.supplierId);
  document.getElementById("printArea").innerHTML = renderPurchaseOrderDocHTML(po, s, true);
  window.print();
}

function diasDesde(fechaISO){ return Math.floor((Date.now() - new Date(fechaISO).getTime())/86400000); }

function agingBadge(fecha, plazoDias){
  const dias = diasDesde(fecha);
  const vencidoPor = dias - (plazoDias||30);
  if(vencidoPor<=0) return `<span class="badge badge-pendiente">Vence en ${Math.abs(vencidoPor)} días</span>`;
  let bucket = "0-30", cls = "badge-cotizado";
  if(vencidoPor>90){ bucket="90+"; cls="badge-rechazado"; }
  else if(vencidoPor>60){ bucket="61-90"; cls="badge-rechazado"; }
  else if(vencidoPor>30){ bucket="31-60"; cls="badge-perdido"; }
  return `<span class="badge ${cls}">Vencido ${vencidoPor}d (${bucket})</span>`;
}

function duplicateQuote(q){
  const folio = DATA.settings.folioPrefijoCotizacion + "-" + String(DATA.nextFolio).padStart(4,"0");
  const subtotal = q.subtotal;
  const iva = Math.round(subtotal*(DATA.settings.ivaRate/100));
  const nueva = {
    ...q,
    id: uid("q"),
    folio,
    fecha: new Date().toISOString(),
    estado: "pendiente",
    ivaRate: DATA.settings.ivaRate,
    iva,
    total: subtotal + iva,
    items: q.items.map(it=>({ ...it })),
    historialEstados: [{ estado:"pendiente", fecha: new Date().toISOString(), quien:"" }],
  };
  DATA.quotes.push(nueva);
  DATA.nextFolio += 1;
  saveData(DATA); render();
  showToast(`Cotización duplicada como ${folio}.`);
  openQuoteView(nueva.id);
}

  saveData(DATA); render();
  showToast("Empresa duplicada — revisa el RUT, quedó vacío para evitar duplicados.");
  openCompanyModal(nueva);
}

function duplicateSupplier(s){
  if(!s) return;
  const nueva = { ...s, id: uid("sup"), nombre: s.nombre+" (copia)", rut: "", codigo: generateSupplierCode(), contactoPrincipalId: "", contactoCobranzaId: "" };
  DATA.suppliers.push(nueva);
  saveData(DATA); render();
  showToast("Proveedor duplicado — revisa el RUT, quedó vacío para evitar duplicados.");
  openSupplierModal(nueva);
}

/* ---------------- pedidos ---------------- */

const ESTADOS_PEDIDO = ["pendiente","preparacion","despacho","entregado","facturado"];
const ESTADOS_PEDIDO_LABEL = { pendiente:"Pendiente", preparacion:"Preparación", despacho:"Despacho", entregado:"Entregado", facturado:"Facturado" };

let pedidoQuery = "";

function createPedidoFromQuote(q){
  const folio = DATA.settings.folioPrefijoPedido + "-" + String(DATA.nextPedidoFolio).padStart(4,"0");
  const pedido = {
    id: uid("ped"), folio,
    quoteId: q.id, quoteFolio: q.folio,
    companyId: q.companyId, contactId: q.contactId, obraId: q.obraId, obraNombre: q.obraNombre,
    fecha: new Date().toISOString(),
    items: q.items.map(it=>({ ...it })),
    subtotal: q.subtotal, iva: q.iva, total: q.total,
    estado: "pendiente",
    notas: q.notas,
    condicionPago: q.condicionPago || "",
    historialEstados: [{ estado:"pendiente", fecha: new Date().toISOString(), quien:"" }],
  };
  DATA.pedidos.push(pedido);
  DATA.nextPedidoFolio += 1;
  saveData(DATA);
  return pedido;
}

function pedidoRow(ped){
  return `
    <div class="row-card">
      <div class="row-main">
        <div class="avatar">${esc(ped.folio.slice(-2))}</div>
        <div>
          <div class="row-title">${esc(ped.folio)} · ${esc(companyName(ped.companyId))}</div>
          <div class="row-sub">${fmtDate(ped.fecha)} ${ped.obraNombre?`· Obra: ${esc(ped.obraNombre)}`:''} ${ped.quoteFolio?`· de ${esc(ped.quoteFolio)}`:''}</div>
        </div>
      </div>
      <span class="badge badge-${ped.estado==='facturado'||ped.estado==='entregado'?'ganado':ped.estado==='pendiente'?'pendiente':'negociacion'}">${ESTADOS_PEDIDO_LABEL[ped.estado]}</span>
      <div class="row-meta" style="color:var(--orange);font-size:12.5px;">${fmt(ped.total)}</div>
      <div class="row-actions">
        <button class="icon-btn" aria-label="Ver" data-view-pedido="${ped.id}" title="Ver">${ICONS.eye}</button>
        <button class="icon-btn" aria-label="Eliminar" data-del-pedido="${ped.id}" title="Eliminar">${ICONS.trash}</button>
      </div>

function renderPedidos(){
  const filtered = DATA.pedidos.filter(p=> (p.folio+companyName(p.companyId)).toLowerCase().includes(pedidoQuery.toLowerCase()))
    .slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `
    ${PageHeader("Post-venta","Pedidos", `${DATA.pedidos.length} pedidos generados desde cotizaciones aceptadas`)}
    <div class="empty" style="text-align:left;">Los pedidos se crean automáticamente cuando marcas una cotización como "Convertida a pedido". Aquí les haces seguimiento hasta la entrega y facturación.</div>
    <div class="search"><input id="pedidoSearch" placeholder="Buscar por folio o empresa..." value="${esc(pedidoQuery)}"/></div>
    <div class="list">${filtered.length===0 ? '<div class="empty">Aún no hay pedidos. Se crean al convertir una cotización.</div>' : filtered.map(pedidoRow).join("")}</div>
  `;
}

function openPedidoView(pedidoId){
  const ped = DATA.pedidos.find(x=>x.id===pedidoId);
  if(!ped) return;
  const company = DATA.companies.find(c=>c.id===ped.companyId);
  const contact = DATA.contacts.find(c=>c.id===ped.contactId);
  const itemsRows = ped.items.map(it=>`<tr><td>${esc(it.sku||"—")}</td><td>${esc(it.nombre)}</td><td class="num">${it.cantidad}</td><td class="num">${esc(it.unidad||"")}</td><td class="num">${fmt(it.precio)}</td><td class="num">${fmt(it.subtotal)}</td></tr>`).join("");
  document.body.insertAdjacentHTML("beforeend", `
    <div class="overlay" id="overlay">
      <div class="modal wide">
        <div class="modal-head"><div class="modal-title">${esc(ped.folio)}</div><button class="modal-close" id="closeModal">${ICONS.close}</button></div>
        <div class="modal-body">
          <div class="field-row">
            <div class="field"><div class="field-label">Estado del pedido</div>
              <select id="pv-estado">${ESTADOS_PEDIDO.map(e=>`<option value="${e}" ${e===ped.estado?"selected":""}>${ESTADOS_PEDIDO_LABEL[e]}</option>`).join("")}</select>
            </div>
            <div class="field"><div class="field-label">Condición de pago</div>
              <select id="pv-condicionPago">
                <option value="">A convenir</option>
                ${CONDICIONES_PAGO.map(x=>`<option value="${esc(x)}" ${ped.condicionPago===x?"selected":""}>${esc(x)}</option>`).join("")}
              </select>
            </div>
            <div class="field"><div class="field-label">Quién hace el cambio (opcional)</div>
              <input type="text" id="pv-quien" list="pvEjecutivosList" placeholder="Nombre..."/>
              <datalist id="pvEjecutivosList">${(DATA.settings.ejecutivos||[]).map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
            </div>
          </div>
          ${(ped.historialEstados&&ped.historialEstados.length>0) ? `
            <div class="hint" style="margin-top:2px;">
              <b>Historial de estados</b><br/>
              ${ped.historialEstados.slice().reverse().map(h=>`${fmtDateTime(h.fecha)} — ${ESTADOS_PEDIDO_LABEL[h.estado]||h.estado}${h.quien?' · '+esc(h.quien):''}`).join("<br/>")}
            </div>
          ` : ''}
          <div class="doc-client" style="margin-top:4px;">
            <div><b>${esc(company?company.razonSocial:"Empresa eliminada")}</b></div>
            ${contact ? `<div>Contacto: ${esc(contact.nombre)}${contact.cargo?` (${esc(contact.cargo)})`:''}${contact.celular||contact.whatsapp?` · Cel/WhatsApp: ${esc(contact.celular||contact.whatsapp)}`:''}${contact.correo?` · ${esc(contact.correo)}`:''}</div>` : ''}
            ${ped.obraNombre?`<div>Obra: ${esc(ped.obraNombre)}</div>`:''}
            <div>Originado desde: ${esc(ped.quoteFolio||'—')}</div>
          </div>
          <table class="doc-table" style="margin-top:16px;">
            <thead><tr><th>SKU</th><th>Producto</th><th>Cant.</th><th>U/Vta</th><th>Precio unit.</th><th>Subtotal</th></tr></thead>
            <tbody>${itemsRows}</tbody>
          </table>
          <div class="doc-totals">
            <div class="line"><span>Subtotal</span><span>${fmt(ped.subtotal)}</span></div>
            <div class="line"><span>IVA</span><span>${fmt(ped.iva)}</span></div>
            <div class="grand"><span>Total</span><span>${fmt(ped.total)}</span></div>
          </div>
          ${ped.notas?`<div class="hint" style="margin-top:8px;">Notas: ${esc(ped.notas)}</div>`:''}
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;">
          <button class="btn-danger-text" id="pv-delete">${ICONS.trash} Eliminar</button>
          <div class="right"><button class="btn btn-primary btn-sm" id="pv-save">Guardar estado</button></div>
        </div>
      </div>
    </div>
  `);
  wireModalClose();
  document.getElementById("pv-save").onclick = ()=>{
    const prevEstado = ped.estado;
    const nuevoEstado = document.getElementById("pv-estado").value;
    const quien = document.getElementById("pv-quien").value.trim();
    ped.estado = nuevoEstado;
    ped.condicionPago = document.getElementById("pv-condicionPago").value;
    if(nuevoEstado !== prevEstado){
      ped.historialEstados = ped.historialEstados || [];
      ped.historialEstados.push({ estado: nuevoEstado, fecha: new Date().toISOString(), quien });
    }
    saveData(DATA); closeModal(); render(); showToast("Pedido actualizado.");
  };
  document.getElementById("pv-delete").onclick = ()=>{
    if(confirm("¿Eliminar este pedido?")){
      DATA.pedidos = DATA.pedidos.filter(x=>x.id!==pedidoId);
      saveData(DATA); closeModal(); render(); showToast("Pedido eliminado.");
    }
  };
}

/* ---------------- historial / cronología por empresa ---------------- */

function openCompanyHistory(companyId){
  const company = DATA.companies.find(c=>c.id===companyId);
  if(!company) return;
  const events = [];
  DATA.activities.filter(a=>a.companyId===companyId).forEach(a=> events.push({ fecha:a.fecha, tipo:"Actividad", icon:ICONS.activities, texto:`${TIPOS_ACTIVIDAD_LABEL[a.tipo]||a.tipo}: ${a.descripcion}` }));
  DATA.quotes.filter(q=>q.companyId===companyId).forEach(q=> events.push({ fecha:q.fecha, tipo:"Cotización", icon:ICONS.quotes, texto:`${q.folio} creada por ${fmt(q.total)} — estado: ${q.estado}` }));
  DATA.deals.filter(d=>d.companyId===companyId).forEach(d=> events.push({ fecha: new Date().toISOString(), tipo:"Negocio", icon:ICONS.pipeline, texto:`${d.title} — etapa: ${STAGES.find(s=>s.id===d.stage)?.label||d.stage} (${fmt(d.value)})` }));
  DATA.pedidos.filter(p=>p.companyId===companyId).forEach(p=> events.push({ fecha:p.fecha, tipo:"Pedido", icon:ICONS.pedidos, texto:`${p.folio} — ${ESTADOS_PEDIDO_LABEL[p.estado]} (${fmt(p.total)})` }));
  events.sort((a,b)=> b.fecha.localeCompare(a.fecha));

  document.body.insertAdjacentHTML("beforeend", `
    <div class="overlay" id="overlay">
      <div class="modal wide">
        <div class="modal-head"><div class="modal-title">Historial · ${esc(company.razonSocial)}</div><button class="modal-close" id="closeModal">${ICONS.close}</button></div>
        <div class="modal-body">
          ${events.length===0 ? '<div class="empty">Todavía no hay interacciones registradas con esta empresa.</div>' : `
            <div class="activity-feed">
              ${events.map(e=>`
                <div class="activity-item">
                  <div class="activity-tag">${e.tipo}</div>
                  <div style="flex:1;">
                    <div class="activity-text">${esc(e.texto)}</div>
                    <div class="activity-meta">${fmtDateTime(e.fecha)}</div>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;"><span></span><div class="right"><button class="btn btn-ghost" id="cancelModal">Cerrar</button></div></div>
      </div>
    </div>
  `);
  wireModalClose();
}

function renderCloudPanel(){
  const cfg = loadFirebaseConfig();
  if(cfg){
    return `
      <div class="empty" style="text-align:left;border-color:${cloudStatus==='connected'?'#BEE0CB':cloudStatus==='error'?'#F0C0B0':'#DADDE0'};background:${cloudStatus==='connected'?'#F1FAF4':cloudStatus==='error'?'#FFF3F0':'#fff'};">
        ${cloudStatusBadge()}
        <div style="margin-top:6px;font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);">Código de espacio de trabajo: <b style="color:var(--text);">${esc(cfg.workspaceCode)}</b></div>
        ${cloudStatus==='error' ? `<div style="margin-top:4px;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--danger);">${esc(cloudErrorMsg)}</div>` : ''}
        <div style="margin-top:10px;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);">Usa este mismo código en cualquier otro dispositivo para que compartan los datos en tiempo real.</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="disconnectCloudBtn" style="margin-top:10px;">Desconectar de la nube</button>
    `;
  }
  return `
    <div class="hint" style="margin-bottom:10px;">Conecta este dispositivo a la nube para sincronizar datos en tiempo real con otros equipos. Solo necesitas un código de espacio de trabajo.</div>
    <div class="field"><div class="field-label">Código de espacio de trabajo</div><input type="text" id="fb-workspaceCode" placeholder="p. ej. lumobral-curico" value="lumobral-principal"/><div class="hint">Usa el mismo código en todos los dispositivos que quieras sincronizar juntos.</div></div>
    <button class="btn btn-primary btn-sm" id="connectCloudBtn" style="margin-top:6px;">Conectar y sincronizar</button>
  `;
}

function wireCloudEvents(){
  const connectBtn = document.getElementById("connectCloudBtn");
  if(connectBtn) connectBtn.addEventListener("click", ()=>{
    const workspaceCode = document.getElementById("fb-workspaceCode").value.trim();
    if(!workspaceCode){
      showToast("Escribe un código de espacio de trabajo.");
      return;
    }
    const cfg = { workspaceCode };
    saveFirebaseConfig(cfg);
    connectFirebase(cfg);
    render();
    showToast("Conectando con Firebase...");
  });
  const disconnectBtn = document.getElementById("disconnectCloudBtn");
  if(disconnectBtn) disconnectBtn.addEventListener("click", ()=>{
    if(confirm("¿Desconectar este dispositivo de la nube? Seguirás viendo tus datos localmente, pero dejarán de sincronizarse con otros dispositivos.")){
      disconnectFirebase(); render();
    }
  });
}

function wireSettingsEvents(){
  const btn = document.getElementById("saveSettings");
  if(!btn) return;
  wireRutInput("s-rut", "s-rut-hint");

  const notifCheckbox = document.getElementById("s-notifPush");
  if(notifCheckbox) notifCheckbox.addEventListener("change", ()=>{
    if(notifCheckbox.checked && "Notification" in window && Notification.permission !== "granted"){
      Notification.requestPermission().then((perm)=>{
        if(perm !== "granted"){ notifCheckbox.checked = false; showToast("El navegador no autorizó las notificaciones."); }
      });
    }
  });
  const notifTestBtn = document.getElementById("s-notifTest");
  if(notifTestBtn) notifTestBtn.addEventListener("click", ()=>{
    if(!("Notification" in window)){ showToast("Este navegador no soporta notificaciones."); return; }
    if(Notification.permission === "granted"){
      new Notification("Lumobral One Suite", { body: "Así se verán tus avisos de cotizaciones por vencer.", icon: "icons/icon-192.png" });
    }else if(Notification.permission === "denied"){
      showToast("Las notificaciones están bloqueadas para este sitio en tu navegador.");
    }else{
      Notification.requestPermission().then((perm)=>{
        if(perm === "granted") new Notification("Lumobral One Suite", { body: "¡Listo! Así se verán tus avisos.", icon: "icons/icon-192.png" });
      });
    }
  });

  const logoFile = document.getElementById("s-logoFile");
  if(logoFile) logoFile.addEventListener("change", (e)=>{
    const file = e.target.files[0]; if(!file) return;
    if(file.size > 3*1024*1024){ showToast("La imagen es muy grande. Usa un logo de menos de 3 MB."); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        // Se redibuja en un canvas para "hornear" la orientación real de la foto
        // (arregla el logo que sale de lado al exportar a PDF) y limitarlo a un tamaño razonable.
        const maxSide = 480;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        DATA.settings.logoUrl = canvas.toDataURL("image/png");
        saveData(DATA); applyTheme(); render();
        showToast("Logo actualizado.");
      };
      img.onerror = ()=> showToast("No se pudo leer esa imagen.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  const logoClear = document.getElementById("s-logoClear");
  if(logoClear) logoClear.addEventListener("click", ()=>{ DATA.settings.logoUrl = ""; saveData(DATA); applyTheme(); render(); showToast("Logo restablecido."); });

  const addEjecBtn = document.getElementById("s-addEjecutivo");
  if(addEjecBtn) addEjecBtn.addEventListener("click", ()=>{
    const input = document.getElementById("s-nuevoEjecutivo");
    const nombre = input.value.trim();
    if(!nombre) return;
    DATA.settings.ejecutivos = DATA.settings.ejecutivos || [];
    if(!DATA.settings.ejecutivos.includes(nombre)) DATA.settings.ejecutivos.push(nombre);
    saveData(DATA); render(); showToast("Ejecutivo agregado.");
  });
  document.querySelectorAll("[data-del-ejecutivo]").forEach(b=> b.addEventListener("click", ()=>{
    DATA.settings.ejecutivos = (DATA.settings.ejecutivos||[]).filter(n=>n!==b.dataset.delEjecutivo);
    saveData(DATA); render(); showToast("Ejecutivo eliminado.");
  }));

  const quickBackupBtn = document.getElementById("quickBackupBtn");
  if(quickBackupBtn) quickBackupBtn.addEventListener("click", exportJSON);
  const sExportJson = document.getElementById("s-exportJson");
  if(sExportJson) sExportJson.addEventListener("click", exportJSON);
  const sImportJson = document.getElementById("s-importJson");
  if(sImportJson) sImportJson.addEventListener("click", importJSON);
  const sExportExcel = document.getElementById("s-exportExcel");
  if(sExportExcel) sExportExcel.addEventListener("click", exportExcel);

  btn.addEventListener("click", ()=>{
    const rutValue = document.getElementById("s-rut").value.trim();
    if(rutValue && !validarRut(rutValue)){ showToast("El RUT ingresado no es válido. Revisa el dígito verificador."); return; }
    DATA.settings = {
      ...DATA.settings,
      razonSocial: document.getElementById("s-razonSocial").value.trim(),
      rut: document.getElementById("s-rut").value.trim(),
      correo: document.getElementById("s-correo").value.trim(),
      direccion: document.getElementById("s-direccion").value.trim(),
      ivaRate: Number(document.getElementById("s-ivaRate").value)||19,
      folioPrefijoCotizacion: document.getElementById("s-folioCot").value.trim().toUpperCase()||"COT",
      folioPrefijoSolicitud: document.getElementById("s-folioSol").value.trim().toUpperCase()||"SOL",
      folioPrefijoPedido: document.getElementById("s-folioPed").value.trim().toUpperCase()||"PED",
      folioPrefijoOC: document.getElementById("s-folioOC").value.trim().toUpperCase()||"OC",
      moneda: document.getElementById("s-moneda").value || "CLP",
      temaColor: document.getElementById("s-temaColor").value || "#FF5A00",
      notifSeguimientoDias: Math.max(0, Number(document.getElementById("s-notifDias").value)||0),
      notificacionesPush: !!document.getElementById("s-notifPush")?.checked,
      backupReminderDays: Math.max(1, Number(document.getElementById("s-backupDias").value)||7),
      pinAcceso: document.getElementById("s-pin").value.trim(),
      correoContador1: document.getElementById("s-correoContador1").value.trim(),
      correoContador2: document.getElementById("s-correoContador2").value.trim(),
      folioPrefijoFactura: document.getElementById("s-folioFac").value.trim().toUpperCase()||"FAC",
      diasPlazoPagoCliente: Math.max(0, Number(document.getElementById("s-plazoCliente").value)||30),
      diasPlazoPagoProveedor: Math.max(0, Number(document.getElementById("s-plazoProveedor").value)||30),
      anticipoMinimoPct: Math.min(100, Math.max(0, Number(document.getElementById("s-anticipoMinimo").value)||0)),
      bancoTransferencia: document.getElementById("s-bancoTransferencia").value.trim(),
      tipoCuentaTransferencia: document.getElementById("s-tipoCuentaTransferencia").value.trim(),
      numeroCuentaTransferencia: document.getElementById("s-numeroCuentaTransferencia").value.trim(),
    };
    saveData(DATA); applyTheme(); render();
    showToast("Configuración guardada.");
  });
  const lockNowBtn = document.getElementById("s-lockNow");
  if(lockNowBtn) lockNowBtn.addEventListener("click", ()=>{
    appUnlocked = false; render(); showPinLock();
  });
  wireCloudEvents();
}

function detailField(label, value){
  return `<div style="margin-bottom:10px;"><div class="field-label">${esc(label)}</div><div style="font-family:'Inter',sans-serif;font-size:13px;color:${value?'var(--text)':'var(--muted-2)'};padding:4px 0;">${value || "—"}</div></div>`;
}

function detailListSection(title, items){
  return `
    <div class="section-label" style="margin-top:16px;">${esc(title)} <span style="color:var(--muted-2);font-weight:400;">(${items.length})</span></div>
    ${items.length ? `<div class="activity-feed">${items.join("")}</div>` : `<div class="hint">Sin registros.</div>`}

function openDetailModal(opts){
  document.body.insertAdjacentHTML("beforeend", `

        <div class="modal-head"><div class="modal-title">${opts.title}</div><button class="modal-close" id="closeModal">${ICONS.close}</button></div>

function attachPageEvents(){
  const newCompanyBtn = document.getElementById("newCompanyBtn");
  if(newCompanyBtn) newCompanyBtn.addEventListener("click", ()=> openCompanyModal(null));
  document.querySelectorAll("[data-view-company]").forEach(b=> b.addEventListener("click", ()=> openCompanyDetail(b.dataset.viewCompany)));
  document.querySelectorAll("[data-edit-company]").forEach(b=> b.addEventListener("click", ()=> openCompanyModal(DATA.companies.find(c=>c.id===b.dataset.editCompany))));
  document.querySelectorAll("[data-dup-company]").forEach(b=> b.addEventListener("click", ()=> duplicateCompany(DATA.companies.find(c=>c.id===b.dataset.dupCompany))));
  document.querySelectorAll("[data-del-company]").forEach(b=> b.addEventListener("click", ()=>{
    if(confirm("¿Eliminar esta empresa? También se eliminarán sus contactos, obras, negocios, cotizaciones y actividades asociadas.")){
      const id = b.dataset.delCompany;
      DATA.companies = DATA.companies.filter(c=>c.id!==id);
      DATA.contacts = DATA.contacts.filter(p=> !(p.tipo==="cliente" && p.parentId===id));
      DATA.obras = DATA.obras.filter(o=>o.companyId!==id);
      DATA.deals = DATA.deals.filter(d=>d.companyId!==id);
      DATA.quotes = DATA.quotes.filter(q=>q.companyId!==id);
      DATA.activities = DATA.activities.filter(a=>a.companyId!==id);
      saveData(DATA); render(); showToast("Empresa eliminada.");
    }
  }));
  wireSearchInput("companySearch", (v)=>{ companyQuery = v; });

  const newContactBtn = document.getElementById("newContactBtn");
  if(newContactBtn) newContactBtn.addEventListener("click", ()=> openContactModal(null));
  document.querySelectorAll("[data-view-contact]").forEach(b=> b.addEventListener("click", ()=> openContactDetail(b.dataset.viewContact)));

  }));
  wireSearchInput("contactSearch", (v)=>{ contactQuery = v; });
  document.querySelectorAll("[data-tipo-filter]").forEach(b=> b.addEventListener("click", ()=>{ contactTipoFilter = b.dataset.tipoFilter; render(); }));

  const newObraBtn = document.getElementById("newObraBtn");
  if(newObraBtn) newObraBtn.addEventListener("click", ()=> openObraModal(null));
  document.querySelectorAll("[data-view-obra]").forEach(b=> b.addEventListener("click", ()=> openObraDetail(b.dataset.viewObra)));

let globalSearchQuery = "";
function renderGlobalSearch(){
  return `
    ${PageHeader("Buscar","Buscador global", "Busca por folio, nombre, RUT o código en toda la app.")}
    <div class="search"><input id="globalSearchInput" placeholder="Escribe para buscar..." value="${esc(globalSearchQuery)}" autocomplete="off"/></div>
    <div id="globalSearchResults">${renderGlobalSearchResults(globalSearchQuery)}</div>
  `;
}
function renderGlobalSearchResults(query){
  const q = query.trim().toLowerCase();
  if(!q) return `<div class="empty">Escribe al menos 2 letras para buscar en empresas, contactos, proveedores, obras, productos, cotizaciones, pedidos y órdenes de compra.</div>`;
  if(q.length < 2) return `<div class="empty">Sigue escribiendo…</div>`;
  const sections = [
    { label:"Empresas", items: DATA.companies.filter(c=> (c.razonSocial+" "+(c.nombreFantasia||"")+" "+(c.rut||"")).toLowerCase().includes(q)).slice(0,6),
      render:(c)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((c.razonSocial||"??").slice(0,2).toUpperCase())}</div><div><div class="row-title">${esc(c.razonSocial)}</div><div class="row-sub">${esc(c.rut||"Sin RUT")}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-company="${c.id}">Ver</button></div></div>` },
    { label:"Contactos", items: DATA.contacts.filter(p=> (p.nombre+" "+(p.correo||"")+" "+(p.celular||"")).toLowerCase().includes(q)).slice(0,6),
      render:(p)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((p.nombre||"??").slice(0,2).toUpperCase())}</div><div><div class="row-title">${esc(p.nombre)}</div><div class="row-sub">${esc(contactParentName(p))}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-contact="${p.id}">Ver</button></div></div>` },
    { label:"Proveedores", items: DATA.suppliers.filter(s=> (s.nombre+" "+(s.rut||"")).toLowerCase().includes(q)).slice(0,6),
      render:(s)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((s.nombre||"??").slice(0,2).toUpperCase())}</div><div><div class="row-title">${esc(s.nombre)}</div><div class="row-sub">${esc(s.rut||"Sin RUT")}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-supplier="${s.id}">Ver</button></div></div>` },
    { label:"Obras", items: DATA.obras.filter(o=> (o.nombre+" "+(o.codigo||"")).toLowerCase().includes(q)).slice(0,6),
      render:(o)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((o.nombre||"??").slice(0,2).toUpperCase())}</div><div><div class="row-title">${esc(o.nombre)}</div><div class="row-sub">${esc(companyName(o.companyId))}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-obra="${o.id}">Ver</button></div></div>` },
    { label:"Productos", items: DATA.products.filter(p=> (p.nombre+" "+(p.sku||"")).toLowerCase().includes(q)).slice(0,6),
      render:(p)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((p.nombre||"??").slice(0,2).toUpperCase())}</div><div><div class="row-title">${esc(p.nombre)}</div><div class="row-sub">${esc(p.sku||"Sin SKU")}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-product="${p.id}">Ver</button></div></div>` },
    { label:"Cotizaciones", items: DATA.quotes.filter(qq=> (qq.folio+" "+companyName(qq.companyId)).toLowerCase().includes(q)).slice(0,6),
      render:(qq)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((qq.folio||"??").slice(-2))}</div><div><div class="row-title">${esc(qq.folio)}</div><div class="row-sub">${esc(companyName(qq.companyId))} · ${fmt(qq.total)}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-quote="${qq.id}">Ver</button></div></div>` },
    { label:"Pedidos", items: (DATA.pedidos||[]).filter(p=> (p.folio+" "+companyName(p.companyId)).toLowerCase().includes(q)).slice(0,6),
      render:(p)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((p.folio||"??").slice(-2))}</div><div><div class="row-title">${esc(p.folio)}</div><div class="row-sub">${esc(companyName(p.companyId))}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-pedido="${p.id}">Ver</button></div></div>` },
    { label:"Órdenes de Compra", items: (DATA.purchaseOrders||[]).filter(po=> (po.folio+" "+supplierName(po.supplierId)).toLowerCase().includes(q)).slice(0,6),
      render:(po)=> `<div class="row-card"><div class="row-main"><div class="avatar">${esc((po.folio||"??").slice(-2))}</div><div><div class="row-title">${esc(po.folio)}</div><div class="row-sub">${esc(supplierName(po.supplierId))}</div></div></div><div class="row-actions"><button class="btn btn-ghost btn-sm" data-view-po="${po.id}">Ver</button></div></div>` },
  ];
  const totalResults = sections.reduce((s,sec)=>s+sec.items.length,0);
  if(totalResults===0) return `<div class="empty">Sin resultados para "${esc(query)}".</div>`;
  return sections.filter(sec=>sec.items.length>0).map(sec=>`
    <div class="section-label" style="margin-top:14px;">${esc(sec.label)} (${sec.items.length})</div>
    <div class="list" style="margin-top:0;">${sec.items.map(sec.render).join("")}</div>
  `).join("");
}

function refocus(id, val){
  const el = document.getElementById(id);
  if(el){ el.focus(); el.setSelectionRange(val.length, val.length); }
}
// Cablea un campo de búsqueda con una pequeña espera antes de filtrar (evita que re-renderizar
// listas grandes en cada tecla se sienta "trabado" en el celular). Lo que escribes entra al
// campo de inmediato; el filtrado se aplica apenas hay una pausa breve.
function wireSearchInput(inputId, onCommit, delay){
  const el = document.getElementById(inputId);
  if(!el) return;
  let timer = null;
  el.addEventListener("input", (e)=>{
    const val = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(()=>{ onCommit(val); render(); refocus(inputId, val); }, delay==null?200:delay);
  });
}

  el.innerHTML = `
    <div style="max-width:640px;margin:40px auto;padding:24px;background:#fff;border:1px solid #F0C0B0;border-radius:10px;font-family:'Inter',sans-serif;">
      <div style="font-family:'Barlow Semi Condensed',sans-serif;font-size:20px;font-weight:700;color:#C0472A;margin-bottom:10px;">La suite no pudo iniciar</div>
      <div style="font-size:13px;color:#262F36;margin-bottom:14px;">Copia este mensaje y env\u00edaselo a soporte para diagnosticarlo \u2014 no es necesario abrir herramientas de desarrollador:</div>
      <pre style="background:#F1F2F3;border-radius:8px;padding:12px;font-size:11.5px;white-space:pre-wrap;word-break:break-word;color:#262F36;">${esc(String(err && err.stack ? err.stack : err))}</pre>
      <div style="font-size:12px;color:#5C6670;margin-top:14px;">Consejo: si abriste este archivo directamente desde una app de chat o un enlace (no desde tus Descargas/Archivos), gu\u00e1rdalo primero en el tel\u00e9fono o computador y \u00e1brelo desde ah\u00ed \u2014 suele resolver este tipo de error.</div>
    </div>
  `;
}

let appUnlocked = false;
function pinRequired(){ return !!(DATA.settings.pinAcceso && String(DATA.settings.pinAcceso).length>0); }

function showPinLock(){
  document.body.insertAdjacentHTML("beforeend", `
    <div id="pinLockScreen">
      <div class="pin-box">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQQAAAEECAMAAAD51ro4AAAAkFBMVEX///////7//v7+//7+/v/+/v7+/v39/v3+/f39/f79/f39/fz9/Pz8/f38/P38/Pz8/Pv7/Pz8+/z7+/z7+/v7+/r6+/v6+fn39/fo6enEwb/SdE7+SQH6RQFsdnpFUVgyQEgvQEhNPTsuPEUtPEQsOkMqPEUpOkMqOUIpN0AmOEElNj8kND4hMDocLTYVJS4UxTLwAAA=" alt="Lumobral" onerror="this.style.display='none'"/>
        <h2>Acceso protegido</h2>
        <p>Ingresa el PIN para abrir Lumobral One Suite.</p>
        <input type="password" inputmode="numeric" id="pinInput" maxlength="12" placeholder="••••"/>
        <div class="pin-error" id="pinError"></div>
        <button class="btn btn-primary" id="pinSubmit">Entrar</button>
      </div>
    </div>
  `);
  const input = document.getElementById("pinInput");
  const tryUnlock = ()=>{
    if(input.value === String(DATA.settings.pinAcceso)){
      appUnlocked = true;
      document.getElementById("pinLockScreen").remove();
      render();
    }else{
      document.getElementById("pinError").textContent = "PIN incorrecto. Intenta de nuevo.";
      input.value=""; input.focus();
    }
  };
  document.getElementById("pinSubmit").addEventListener("click", tryUnlock);
  input.addEventListener("keydown",(e)=>{ if(e.key==="Enter") tryUnlock(); });
  input.focus();
}

loadDataAsync().then((data)=>{
  DATA = data;
  applyTheme();
  if(pinRequired() && !appUnlocked){
    showPinLock();
  }else{
    render();
    checkAndNotify();
  }
  if(storageBlocked && idbBlocked){
    showToast("Este navegador bloque\u00f3 el almacenamiento local \u2014 los datos no se guardar\u00e1n al cerrar. Guarda tu archivo en Descargas y \u00e1brelo desde ah\u00ed para solucionarlo.");
  }
}).catch((err)=>{
  showFatalError(err);
});
window.addEventListener("error", (e)=>{
  if(!document.getElementById("pageContent") || document.getElementById("pageContent").children.length===0){
    showFatalError(e.error || e.message);
  }
});
