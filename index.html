<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --teal:#36454F; --teal-dark:#262F36; --orange:#FF5A00; --orange-dark:#DD5308; --orange-light:#FFC7A3;
    --bg:#F1F2F3; --grid:#E3E5E7; --card:#FFFFFF; --border:#DADDE0; --border-soft:#E7E9EB;
    --text:#262F36; --muted:#5C6670; --muted-2:#8B939A; --danger:#C0472A; --good:#1F7A4D; --blue:#3A54A8;
    --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
    --shadow-xs:0 1px 2px rgba(38,47,54,.06);
    --shadow-sm:0 1px 3px rgba(38,47,54,.07), 0 1px 2px rgba(38,47,54,.05);
    --shadow-md:0 4px 14px rgba(38,47,54,.09), 0 1px 3px rgba(38,47,54,.06);
    --shadow-lg:0 14px 40px rgba(20,26,30,.16), 0 3px 10px rgba(20,26,30,.08);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:'Inter',sans-serif;background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:28px 28px;color:var(--text);-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#B9C4C2;border-radius:5px;border:2px solid var(--bg);background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:#9FADAB;}
  #app{display:flex;min-height:100vh;}

  #sidebar{width:212px;flex-shrink:0;background:var(--teal);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-shadow:2px 0 16px rgba(0,0,0,.12);z-index:5;}
  .brand{display:flex;align-items:center;gap:12px;padding:26px 20px 18px;}
  .brand img{width:80px;height:80px;object-fit:cover;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,90,0,0.55), 0 4px 14px rgba(0,0,0,0.35);flex-shrink:0;}
  .brand-name{font-family:'Barlow Semi Condensed',sans-serif;font-size:17px;font-weight:700;color:#fff;letter-spacing:.02em;text-transform:uppercase;}
  .brand-tag{font-family:'Inter',sans-serif;font-size:9.5px;color:#8FB6BC;margin-top:1px;}
  .brand-legal{font-family:'IBM Plex Mono',monospace;font-size:8px;color:#4C7B82;margin-top:3px;line-height:1.4;}
  nav{padding:4px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;}
  .nav-btn{display:flex;align-items:center;gap:9px;padding:7.5px 12px;border-radius:7px;border:none;background:transparent;color:#A9C7CB;font-family:'Inter',sans-serif;font-size:12.8px;font-weight:500;text-align:left;cursor:pointer;border-left:2px solid transparent;transition:all .16s var(--ease);width:100%;}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:#DCE9EA;}
  .nav-btn.active{background:rgba(245,96,15,.16);color:#fff;border-left:2px solid var(--orange);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
  .nav-btn svg{flex-shrink:0;width:19px;height:19px;transition:transform .16s var(--ease);}
  .nav-btn:hover svg{transform:translateX(1px);}
  .sidebar-foot{padding:10px 20px 14px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5E888D;line-height:1.6;flex-shrink:0;}
  .sidebar-foot button{margin-top:6px;background:transparent;border:1px solid #23636D;color:#A9C7CB;border-radius:6px;padding:6px 9px;font-family:'Inter',sans-serif;font-size:10px;cursor:pointer;width:100%;text-align:left;transition:all .15s var(--ease);}
  .sidebar-foot button:hover{border-color:var(--orange);color:#fff;background:rgba(255,90,0,.08);}

  #main{flex:1;overflow-y:auto;}
  .page{padding:32px 38px 60px;max-width:1140px;}
  .page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--orange);letter-spacing:.08em;text-transform:uppercase;}
  h1{font-family:'Barlow Semi Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--text);margin:6px 0 0;letter-spacing:.01em;}
  .subtitle{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);margin-top:6px;}
  .section-label{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:32px 0 12px;}

  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:9px 15px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .15s var(--ease);}
  .btn-primary{background:var(--orange);color:#fff;box-shadow:0 1px 2px rgba(221,83,8,.25);} .btn-primary:hover{background:var(--orange-dark);box-shadow:0 3px 10px rgba(221,83,8,.35);transform:translateY(-1px);} .btn-primary:active{transform:translateY(0);box-shadow:0 1px 2px rgba(221,83,8,.25);}
  .btn-primary:disabled{background:var(--orange-light);cursor:not-allowed;box-shadow:none;transform:none;}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--teal-dark);} .btn-ghost:hover{border-color:var(--orange);color:var(--orange-dark);background:#FFF8F4;}
  .btn-sm{padding:6px 10px;font-size:11.5px;}
  .btn-danger-text{background:none;border:none;color:var(--danger);font-family:'Inter',sans-serif;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s var(--ease);} .btn-danger-text:hover{opacity:.75;}

  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;margin-top:20px;max-width:340px;transition:all .15s var(--ease);box-shadow:var(--shadow-xs);}
  .search:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,90,0,.12);}
  .search::before{content:"";width:15px;height:15px;flex-shrink:0;background:no-repeat center/contain url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%235C6670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>');}
  .search input{border:none;outline:none;background:transparent;font-family:'Inter',sans-serif;font-size:13px;width:100%;color:var(--text);}

  .list{margin-top:18px;display:flex;flex-direction:column;gap:8px;}
  .row-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 14px;flex-wrap:wrap;transition:box-shadow .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease);box-shadow:var(--shadow-xs);}
  .row-card:hover{box-shadow:var(--shadow-sm);border-color:#CBD2D6;}
  .avatar{width:32px;height:32px;border-radius:8px;background:var(--teal);color:var(--orange);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .row-main{display:flex;align-items:center;gap:12px;flex:1;min-width:220px;}
  .row-title{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;color:var(--text);}
  .row-sub{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-top:1px;}
  .row-meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);text-align:right;flex-shrink:0;}
  .row-actions{display:flex;gap:4px;flex-shrink:0;}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--radius-sm);padding:6px;cursor:pointer;display:flex;align-items:center;transition:all .15s var(--ease);}
  .icon-btn:hover{background:#FFF3EC;border-color:var(--orange);color:var(--orange-dark);}

  .empty{padding:34px 20px;text-align:center;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--muted-2);border:1.5px dashed #CBD5D3;border-radius:var(--radius-md);background:var(--card);margin-top:18px;}

const STORAGE_KEY = "lumobral_onesuite_data_v2";

/* Envoltorio seguro de localStorage: si el navegador lo bloquea (modo privado,
   políticas de archivos locales, content:// en Android, etc.) la app sigue
   funcionando con los datos en memoria durante la sesión, en vez de quedar
   en blanco. Solo se pierde la persistencia entre visitas, nunca la app. */
const memoryFallback = {};
let storageBlocked = false;
function safeGetItem(key){
  try{ return localStorage.getItem(key); }catch(e){ storageBlocked = true; return Object.prototype.hasOwnProperty.call(memoryFallback,key) ? memoryFallback[key] : null; }
}
function safeSetItem(key, val){
  try{ localStorage.setItem(key, val); }catch(e){ storageBlocked = true; memoryFallback[key] = val; }
}
function safeRemoveItem(key){
  try{ localStorage.removeItem(key); }catch(e){ storageBlocked = true; delete memoryFallback[key]; }
}

const SKU_STOPWORDS = new Set(["y","de","del","la","el","los","las","en","para","con","a"]);
function skuAbbrev(text){
  const clean = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const words = String(text||"").trim().split(/\s+/).filter(w=> w && !SKU_STOPWORDS.has(w.toLowerCase()));
  if(words.length===0) return "XX";
  if(words.length===1) return (clean(words[0])+"XX").slice(0,2);
  return (clean(words[0])[0]||"X") + (clean(words[1])[0]||"X");
}
function generateSku(categoria, familia, excludeProductId){
  if(!categoria || !familia) return "";
  const ac = skuAbbrev(categoria), af = skuAbbrev(familia);
  const prefix = `${ac}-${af}-`;
  const nums = DATA.products.filter(p=> p.id!==excludeProductId && p.sku && p.sku.startsWith(prefix))
    .map(p=> parseInt(p.sku.slice(prefix.length),10)||0);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `${prefix}${String(next).padStart(3,"0")}`;
}
function generateSupplierCode(excludeSupplierId){
  const nums = DATA.suppliers.filter(s=> s.id!==excludeSupplierId && s.codigo && /^PROV-\d+$/.test(s.codigo))
    .map(s=> parseInt(s.codigo.slice(5),10)||0);
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `PROV-${String(next).padStart(3,"0")}`;
}

function uid(p){ return p + Math.random().toString(36).slice(2,9); }

function siguienteFolioDesde(folioIngresado, contadorActual){
  const match = String(folioIngresado).match(/(\d+)\s*$/);
  if(match){
    const n = parseInt(match[1], 10);
    if(!isNaN(n)) return Math.max(contadorActual, n+1);
  }
  return contadorActual + 1;
}

function shadeColor(hex, percent){
  try{
    const n = parseInt(hex.replace('#',''),16);
    const r = Math.min(255,Math.max(0,(n>>16)+percent));
    const g = Math.min(255,Math.max(0,((n>>8)&0xff)+percent));
    const b = Math.min(255,Math.max(0,(n&0xff)+percent));
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }catch(e){ return hex; }
}

/* ---------------- IndexedDB: almacenamiento principal (con localStorage como respaldo) ---------------- */
const IDB_NAME = "lumobral_onesuite_idb";
const IDB_VERSION = 1;
const IDB_STORE = "kv";
let idbDb = null;
let idbBlocked = false;

function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(idbDb){ resolve(idbDb); return; }
    if(typeof indexedDB === "undefined"){ idbBlocked = true; reject(new Error("IndexedDB no disponible")); return; }
    try{
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = (e)=>{ idbDb = e.target.result; resolve(idbDb); };
      req.onerror = ()=>{ idbBlocked = true; reject(req.error || new Error("No se pudo abrir IndexedDB")); };
      req.onblocked = ()=>{ idbBlocked = true; reject(new Error("IndexedDB bloqueado")); };
    }catch(e){ idbBlocked = true; reject(e); }
  });
}
function idbGet(key){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    try{
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    }catch(e){ reject(e); }
  }));
}
function idbSet(key, value){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    try{
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    }catch(e){ reject(e); }
  }));
}

      cloudStatus = "connected"; cloudErrorMsg = "";

          applyingRemoteUpdate = true;

// Avisa (notificación del navegador) sobre cotizaciones vencidas o por vencer, máximo una vez al día,
// y solo si el usuario activó la opción en Configuración y otorgó permiso al navegador.
function checkAndNotify(){
  try{
    if(!("Notification" in window)) return;
    if(!DATA.settings || !DATA.settings.notificacionesPush) return;
    if(Notification.permission !== "granted") return;
    const hoy = new Date().toDateString();
    const ultima = localStorage.getItem("lumobral_last_notify_check");
    if(ultima === hoy) return;
    const pendientes = (DATA.quotes||[]).filter(q=>q.estado==="pendiente");
    const vencidas = pendientes.filter(q=> q.validezTipo!=="alza_fabrica" && (Date.now() - new Date(q.fecha).getTime()) > q.validezDias*86400000);
    const porVencer = pendientes.filter(q=>{ const d = quoteDiasRestantes(q); return d!==null && d>=0 && d<=2; });
    localStorage.setItem("lumobral_last_notify_check", hoy);
    if(vencidas.length===0 && porVencer.length===0) return;
    const partes = [];
    if(vencidas.length) partes.push(`${vencidas.length} cotización(es) vencida(s) sin respuesta`);
    if(porVencer.length) partes.push(`${porVencer.length} por vencer en los próximos 2 días`);
    new Notification("Lumobral One Suite", { body: partes.join(" · "), icon: "icons/icon-192.png" });
  }catch(e){ /* silencioso: nunca debe romper el arranque de la app */ }
}
function quoteDiasRestantes(q){
  if(q.validezTipo==="alza_fabrica") return null;
  const dias = Number(q.validezDias)||0;
  const transcurridos = (Date.now() - new Date(q.fecha).getTime())/86400000;
  return Math.ceil(dias - transcurridos);
}

function registrarMovimientoStock(prod, delta, motivo){
  if(!prod || !delta) return;
  prod.movimientosStock = prod.movimientosStock || [];
  prod.movimientosStock.push({ fecha: new Date().toISOString(), delta, motivo, saldo: Number(prod.stock)||0 });

function limpiarRut(rut){ return String(rut||"").replace(/[^0-9kK]/g,"").toUpperCase(); }
function validarRut(rutRaw){
  const rut = limpiarRut(rutRaw);
  if(rut.length < 2) return false;
  const cuerpo = rut.slice(0, -1);
  const dv = rut.slice(-1);
  if(!/^\d+$/.test(cuerpo)) return false;
  let suma = 0, multiplo = 2;
  for(let i = cuerpo.length - 1; i >= 0; i--){
    suma += parseInt(cuerpo[i], 10) * multiplo;
    multiplo = multiplo === 7 ? 2 : multiplo + 1;
  }
  const resto = 11 - (suma % 11);
  const dvEsperado = resto === 11 ? "0" : resto === 10 ? "K" : String(resto);
  return dv === dvEsperado;
}
function formatearRut(rutRaw){
  const rut = limpiarRut(rutRaw);
  if(rut.length < 2) return rutRaw;
  const cuerpo = rut.slice(0, -1);
  const dv = rut.slice(-1);
  let cuerpoFmt = "";
  for(let i = 0; i < cuerpo.length; i++){
    const posDesdeFinal = cuerpo.length - i;
    cuerpoFmt += cuerpo[i];
    if(posDesdeFinal > 1 && (posDesdeFinal - 1) % 3 === 0) cuerpoFmt += ".";
  }
  return `${cuerpoFmt}-${dv}`;
}
// Engancha validación en vivo a un <input> de RUT: bordea en rojo y muestra hint si el DV no calza.
// Solo valida cuando el campo tiene contenido — un RUT vacío (ej. tras "Duplicar") no se marca como error.
function wireRutInput(inputId, hintId, getPais){
  const input = document.getElementById(inputId);
  if(!input) return;
  const hint = hintId ? document.getElementById(hintId) : null;
  const aplica = ()=> !getPais || (getPais().trim().toLowerCase()==="chile" || getPais().trim()==="");
  const check = ()=>{
    const val = input.value.trim();
    if(!val || !aplica()){ input.style.borderColor = ""; if(hint) hint.style.display = "none"; return; }
    const ok = validarRut(val);
    input.style.borderColor = ok ? "" : "#E0523F";
    if(hint) hint.style.display = ok ? "none" : "block";
  };
  input.addEventListener("blur", ()=>{
    if(input.value.trim() && aplica() && validarRut(input.value)) input.value = formatearRut(input.value);
    check();
  });
  input.addEventListener("input", check);
}

function exportQuotesCSV(){
  const rows = [["Folio","Empresa","Obra","Fecha","Estado","Subtotal","IVA","Total"]];
  DATA.quotes.forEach(q=> rows.push([q.folio, companyName(q.companyId), q.obraNombre||"", fmtDate(q.fecha), q.estado, q.subtotal, q.iva, q.total]));
  const csv = rows.map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], { type:"text/csv;charset=utf-8;" });

  const a = document.createElement("a"); a.href=url; a.download=`lumobral-cotizaciones-${new Date().toISOString().slice(0,10)}.csv`; a.click();

}

function importJSON(){
  const input = document.createElement("input"); input.type="file"; input.accept="application/json";
  input.onchange = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.companies && !parsed.products) throw new Error("Formato inválido");
        DATA = migrate(Object.assign(seedData(), parsed));
        saveData(DATA); render(); showToast("Datos importados correctamente.");
      }catch(err){ showToast("No se pudo leer el archivo JSON."); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function buildMonthlySales(){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: d.getFullYear()+"-"+d.getMonth(), label: d.toLocaleDateString("es-CL",{month:"short"}).replace(".",""), total:0 });
  }
  DATA.quotes.filter(q=>q.estado==="aceptada"||q.estado==="convertida_pedido").forEach(q=>{
    const d = new Date(q.fecha);
    const key = d.getFullYear()+"-"+d.getMonth();
    const m = months.find(x=>x.key===key);
    if(m) m.total += q.total;
  });
  return months;
}

function svgLineChart(points){
  const w = 460, h = 150, pad = 26;
  const max = Math.max(1, ...points.map(p=>p.total));
  const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - (p.total/max)*(h-pad*2-10);
    return { x, y, ...p };
  });
  const path = coords.map((c,i)=> (i===0?"M":"L")+c.x.toFixed(1)+","+c.y.toFixed(1)).join(" ");
  const area = coords.length ? `${path} L${coords[coords.length-1].x.toFixed(1)},${h-pad} L${coords[0].x.toFixed(1)},${h-pad} Z` : "";
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;">
      <path d="${area}" fill="rgba(255,90,0,0.12)" stroke="none"/>
      <path d="${path}" fill="none" stroke="var(--orange)" stroke-width="2.5"/>
      ${coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="var(--orange)"/>`).join("")}
      ${coords.map(c=>`<text x="${c.x.toFixed(1)}" y="${h-7}" font-size="10" fill="#5C6670" text-anchor="middle" font-family="Inter,sans-serif">${esc(c.label)}</text>`).join("")}
    </svg>
  `;
}

function svgDonutChart(segments, size){
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = size/2 - 15, cx=size/2, cy=size/2, circumference = 2*Math.PI*r;
  if(total===0){
    return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0;"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E3E5E7" stroke-width="16"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" fill="#8B939A" font-family="Inter,sans-serif">Sin datos</text></svg>`;
  }
  let offset = 0;
  const circles = segments.filter(s=>s.value>0).map(seg=>{
    const frac = seg.value/total;
    const dash = frac*circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="16" stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return el;
  });
  return `
    <svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0;">
      ${circles.join("")}
      <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="19" font-weight="700" fill="#262F36" font-family="'Barlow Semi Condensed',sans-serif">${total}</text>
      <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="9.5" fill="#8B939A" font-family="Inter,sans-serif">Total</text>
    </svg>
  `;
}

function renderReportes(){
  // ventas por ejecutivo (negocios ganados)
  const ganados = DATA.deals.filter(d=>d.stage==="ganado");
  const porEjecutivo = {};
  ganados.forEach(d=>{
    const c = DATA.companies.find(x=>x.id===d.companyId);
    const ejec = (c && c.ejecutivo) ? c.ejecutivo : "Sin asignar";
    porEjecutivo[ejec] = (porEjecutivo[ejec]||0) + Number(d.value||0);
  });
  const ejecutivosOrdenados = Object.entries(porEjecutivo).sort((a,b)=>b[1]-a[1]);
  const maxEjec = Math.max(1, ...ejecutivosOrdenados.map(x=>x[1]));

  // pipeline por etapa
  const pipelineStages = STAGES.map(s=>({ label:s.label, value: DATA.deals.filter(d=>d.stage===s.id).reduce((sum,d)=>sum+Number(d.value||0),0), count: DATA.deals.filter(d=>d.stage===s.id).length }));
  const maxStage = Math.max(1, ...pipelineStages.map(s=>s.value));

  // estado de obras
  const obraColors = { planificacion:"#8B939A", en_curso:"#1F7A4D", terminada:"#3A54A8", paralizada:"#C0472A" };
  const obrasPorEstado = ESTADOS_OBRA.map(e=>({ label:ESTADOS_OBRA_LABEL[e], value: DATA.obras.filter(o=>o.estado===e).length, color:obraColors[e] }));

  // stock bajo
  const bajoStock = DATA.products.filter(p=> p.stockMinimo>0 && p.stock<=p.stockMinimo).sort((a,b)=> (a.stock/Math.max(1,a.stockMinimo)) - (b.stock/Math.max(1,b.stockMinimo)));

  // actividad reciente global (auditoría)
  const eventos = [];
  DATA.activities.forEach(a=> eventos.push({ fecha:a.fecha, tipo:"Actividad", texto:`${esc(companyName(a.companyId))}: ${TIPOS_ACTIVIDAD_LABEL[a.tipo]||a.tipo} — ${esc(a.descripcion)}` }));
  DATA.quotes.forEach(q=> eventos.push({ fecha:q.fecha, tipo:"Cotización", texto:`${esc(q.folio)} · ${esc(companyName(q.companyId))} — ${fmt(q.total)} (${esc(q.estado)})` }));
  DATA.pedidos.forEach(p=> eventos.push({ fecha:p.fecha, tipo:"Pedido", texto:`${esc(p.folio)} · ${esc(companyName(p.companyId))} — ${fmt(p.total)}` }));
  eventos.sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));
  const ultimosEventos = eventos.slice(0,12);

  return `
    ${PageHeader("Analítica","Reportes","Indicadores de ventas, abastecimiento y actividad de toda la operación.", `<button class="btn btn-ghost" id="reportExportExcelBtn">${ICONS.upload} Exportar a Excel</button>`)}

    <div class="two-col" style="margin-top:20px;">
      <div class="kpi" style="padding:16px 18px;">
        <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text);margin-bottom:12px;">Ventas ganadas por ejecutivo</div>
        ${ejecutivosOrdenados.length===0 ? '<div class="empty">Aún no hay negocios ganados.</div>' : ejecutivosOrdenados.map(([nombre,val])=> barRow(nombre, val, maxEjec, "var(--orange)", fmt(val))).join("")}
      </div>
      <div class="kpi" style="padding:16px 18px;">
        <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text);margin-bottom:12px;">Valor del pipeline por etapa</div>
        ${pipelineStages.map(s=> barRow(s.label, s.value, maxStage, "var(--teal)", `${fmt(s.value)} · ${s.count} neg.`)).join("")}
      </div>
    </div>

    <div class="two-col" style="margin-top:18px;">
      <div class="kpi" style="padding:16px 18px;">
        <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;">Estado de las obras</div>
        <div style="display:flex;align-items:center;gap:20px;">
          ${svgDonutChart(obrasPorEstado, 120)}
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${obrasPorEstado.map(s=>`<div style="display:flex;align-items:center;gap:7px;font-family:'Inter',sans-serif;font-size:11.5px;color:var(--text);"><span style="width:9px;height:9px;border-radius:2px;background:${s.color};display:inline-block;"></span>${esc(s.label)} (${s.value})</div>`).join("")}
          </div>
        </div>
      </div>
      <div class="kpi" style="padding:16px 18px;">
        <div style="font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;">⚠ Stock bajo el mínimo (${bajoStock.length})</div>
        ${bajoStock.length===0 ? '<div class="hint">Todo el catálogo está sobre su stock mínimo.</div>' : `
          <div class="activity-feed">
            ${bajoStock.slice(0,8).map(p=>`<div class="activity-item"><div class="activity-tag" style="background:#FFF3F0;color:var(--danger);">Stock</div><div style="flex:1;"><div class="activity-text">${esc(p.nombre)}</div><div class="activity-meta">${p.stock} ${esc(unitLabel(p))} de ${p.stockMinimo} mínimo</div></div></div>`).join("")}
          </div>
        `}
      </div>
    </div>

    <div class="section-label" style="margin-top:20px;">Actividad reciente en toda la suite</div>
    ${ultimosEventos.length===0 ? '<div class="empty">Todavía no hay actividad registrada.</div>' : `
      <div class="activity-feed">
        ${ultimosEventos.map(e=>`<div class="activity-item"><div class="activity-tag">${esc(e.tipo)}</div><div style="flex:1;"><div class="activity-text">${e.texto}</div><div class="activity-meta">${fmtDateTime(e.fecha)}</div></div></div>`).join("")}
      </div>
    `}
  `;
}

  };
}

            <label for="f-rolPago" style="font-family:'Inter',sans-serif;font-size:12.5px;color:var(--text);cursor:pointer;">Es el contacto de cobranza / a quien se le paga o transfiere</label>
          </div>
          <div class="field"><div class="field-label">Observaciones</div><textarea id="f-observaciones" placeholder="Notas sobre este contacto...">${esc(p.observaciones)}</textarea></div>
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;"><span></span><div class="right">
          <button class="btn btn-ghost" id="cancelModal">Cancelar</button>
          <button class="btn btn-primary" id="saveContact">${isEdit?"Guardar cambios":"Crear contacto"}</button>
        </div></div>
      </div>
    </div>
  `);
  wireModalClose();

  function refreshParentOptions(tipo, selectedId){
    const label = document.getElementById("f-parentLabel");
    const select = document.getElementById("f-parentId");
    const zonaWrap = document.getElementById("f-zonaWrap");
    const rolPagoWrap = document.getElementById("f-rolPagoWrap");
    if(tipo==="proveedor"){
      label.textContent = "Proveedor";
      select.innerHTML = DATA.suppliers.map(s=>`<option value="${s.id}" ${s.id===selectedId?"selected":""}>${esc(s.nombre)}</option>`).join("") || `<option value="">Sin proveedores — crea uno primero</option>`;
      zonaWrap.style.display = "";
      rolPagoWrap.style.display = "flex";
    }else{
      label.textContent = "Empresa";
      select.innerHTML = DATA.companies.map(c=>`<option value="${c.id}" ${c.id===selectedId?"selected":""}>${esc(c.razonSocial)}</option>`).join("") || `<option value="">Sin empresas — crea una primero</option>`;
      zonaWrap.style.display = "none";
      rolPagoWrap.style.display = "none";
    }
  }
  refreshParentOptions(p.tipo, p.parentId);
  document.getElementById("f-tipo").addEventListener("change",(e)=> refreshParentOptions(e.target.value, ""));

  document.getElementById("saveContact").onclick = ()=>{
    const btn = document.getElementById("saveContact");
    if(btn.disabled) return;
    const nombre = document.getElementById("f-nombre").value.trim();
    if(!nombre){ showToast("El nombre es obligatorio."); return; }
    const parentId = document.getElementById("f-parentId").value;
    if(!parentId){ showToast("Selecciona a qué empresa o proveedor pertenece."); return; }
    btn.disabled = true;
    const payload = {
      id: contact ? contact.id : uid("p"),
      tipo: document.getElementById("f-tipo").value,
      parentId,
      nombre,
      cargo: document.getElementById("f-cargo").value.trim(),
      zona: document.getElementById("f-zona").value.trim(),
      rolPago: document.getElementById("f-rolPago").checked,
      correo: document.getElementById("f-correo").value.trim(),
      celular: document.getElementById("f-celular").value.trim(),
      whatsapp: document.getElementById("f-whatsapp").value.trim(),
      cumpleanos: document.getElementById("f-cumpleanos").value,
      observaciones: document.getElementById("f-observaciones").value.trim(),
    };
    if(contact){ DATA.contacts = DATA.contacts.map(p=> p.id===contact.id ? payload : p); }
    else{ DATA.contacts.push(payload); }
    saveData(DATA); closeModal(); render();
    showToast(contact ? "Contacto actualizado." : "Contacto creado.");
  };
}

function renderPipeline(){
  const cols = STAGES.map(s=>{

          </div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:2px;">${fmt(stageValue)}</div>

function wirePipelineDrag(){
  document.querySelectorAll(".deal-card").forEach(card=> card.addEventListener("dragstart", ()=>{ dragDealId = card.dataset.deal; }));
  document.querySelectorAll(".pipeline-col").forEach(col=>{
    col.addEventListener("dragover", (e)=> e.preventDefault());
    col.addEventListener("drop", ()=>{
      if(!dragDealId) return;
      DATA.deals = DATA.deals.map(d=> d.id===dragDealId ? { ...d, stage: col.dataset.stage } : d);
      saveData(DATA); render();
    });
  });
  document.querySelectorAll(".deal-card").forEach(card=> card.addEventListener("click", ()=> openDealModal(DATA.deals.find(d=>d.id===card.dataset.deal))));
  document.querySelectorAll("[data-view-deal]").forEach(b=> b.addEventListener("click", (e)=>{ e.stopPropagation(); openDealDetail(b.dataset.viewDeal); }));
  document.querySelectorAll("[data-edit-deal]").forEach(b=> b.addEventListener("click", (e)=>{ e.stopPropagation(); openDealModal(DATA.deals.find(d=>d.id===b.dataset.editDeal)); }));
}

/* ---------------- products ---------------- */

let productQuery = "";
let productGroupBy = "ninguno"; // ninguno | familia | categoria | proveedor
let productFavOnly = false;

function marginBadge(p){
  if(!p.precioVenta) return '';
  const margin = Math.round(((p.precioVenta - p.costo)/p.precioVenta)*100);
  const cls = margin < 0 ? "badge-margin-neg" : margin < 15 ? "badge-margin-low" : "badge-margin-good";
  return `<span class="badge ${cls}">${margin}% margen</span>`;
}

function productRowCard(p){
  return `
    <div class="row-card">
      <button class="icon-btn fav-toggle" data-toggle-fav="${p.id}" title="${p.favorito?'Quitar de favoritos':'Marcar como favorito'}" style="${p.favorito?'color:var(--orange);border-color:var(--orange);':''}">${ICONS.star.replace('{FILL}', p.favorito?'currentColor':'none')}</button>
      <div class="row-main">
        ${p.imagenUrl ? `<img src="${esc(p.imagenUrl)}" alt="${esc(p.nombre)}" style="width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border);" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/><div class="avatar" style="display:none;">${esc(p.nombre.slice(0,2).toUpperCase())}</div>` : `<div class="avatar">${esc(p.nombre.slice(0,2).toUpperCase())}</div>`}
        <div>
          <div class="row-title">${esc(p.nombre)}</div>
          <div class="row-sub">${p.sku?`SKU ${esc(p.sku)} · `:''}${esc(p.marca||"")} ${p.marca?'· ':''}${esc(p.categoria||"Sin categoría")} · ${esc(unitLabel(p))}</div>
          <div class="row-sub">Stock: ${p.stock} ${p.stock<=p.stockMinimo && p.stockMinimo>0?'<span style="color:var(--danger);">(bajo mínimo)</span>':''} ${p.proveedorId?`· Proveedor: ${esc(supplierName(p.proveedorId))}`:''}</div>
        </div>
      </div>
      <div class="row-meta">Costo ${fmt(p.costo)}</div>
      <div class="row-meta" style="color:var(--orange);font-size:12.5px;">Venta ${fmt(p.precioVenta)}</div>
      ${marginBadge(p)}
      <div class="row-actions">
        <button class="icon-btn" aria-label="Ver ficha" data-view-product="${p.id}" title="Ver ficha">${ICONS.eye}</button>
        <button class="icon-btn" aria-label="Editar" data-edit-product="${p.id}" title="Editar">${ICONS.edit}</button>
        <button class="icon-btn" aria-label="Eliminar" data-del-product="${p.id}" title="Eliminar">${ICONS.trash}</button>
      </div>
    </div>
  `;
}

function renderProducts(){
  let filtered = DATA.products.filter(p => (p.nombre+p.categoria+(p.sku||"")+(p.marca||"")+(p.familia||"")+(p.proveedorId?supplierName(p.proveedorId):"")).toLowerCase().includes(productQuery.toLowerCase()));
  if(productFavOnly) filtered = filtered.filter(p=>p.favorito);
  const bajoStock = DATA.products.filter(p=> p.stock <= p.stockMinimo && p.stockMinimo>0);

  const groupField = { familia:"familia", categoria:"categoria", proveedor:null }[productGroupBy];
  let groupedHtml = "";
  if(productGroupBy === "ninguno"){
    groupedHtml = filtered.length===0 ? '<div class="empty">No hay productos que coincidan.</div>' : filtered.map(productRowCard).join("");
  }else{
    const groups = {};
    filtered.forEach(p=>{
      const key = productGroupBy==="proveedor" ? (p.proveedorId ? supplierName(p.proveedorId) : "Sin proveedor") : (p[groupField] || `Sin ${productGroupBy}`);
      groups[key] = groups[key] || [];
      groups[key].push(p);
    });
    const keys = Object.keys(groups).sort((a,b)=> a.localeCompare(b));
    groupedHtml = keys.length===0 ? '<div class="empty">No hay productos que coincidan.</div>' : keys.map(k=>`
      <div class="section-label" style="margin:22px 0 10px;">${esc(k)} <span style="color:var(--muted-2);font-weight:400;">(${groups[k].length})</span></div>
      <div class="list" style="margin-top:0;">${groups[k].map(productRowCard).join("")}</div>
    `).join("");
  }

  return `
    ${PageHeader("Catálogo","Productos", `${DATA.products.length} productos con costo y precio vigente`, `<button class="btn btn-primary" id="newProductBtn">${ICONS.plus} Nuevo producto</button>`)}
    ${bajoStock.length>0 ? `<div class="empty" style="text-align:left;border-color:#F0C9A3;background:#FFF7F0;">⚠ ${bajoStock.length} producto${bajoStock.length!==1?'s':''} bajo el stock mínimo: ${bajoStock.map(p=>esc(p.nombre)).join(', ')}</div>` : ''}
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:20px;">
      <div class="search" style="margin-top:0;"><input id="productSearch" placeholder="Buscar por nombre, SKU, marca, familia, categoría o proveedor..." value="${esc(productQuery)}"/></div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn ${productFavOnly?'btn-primary':'btn-ghost'} btn-sm" id="favOnlyBtn">${ICONS.star.replace('{FILL}', productFavOnly?'currentColor':'none')} Favoritos</button>
        <span style="font-family:'Inter',sans-serif;font-size:11.5px;color:var(--muted);margin-left:6px;">Agrupar por:</span>
        <button class="btn ${productGroupBy==='ninguno'?'btn-primary':'btn-ghost'} btn-sm" data-group-by="ninguno">Ninguno</button>
        <button class="btn ${productGroupBy==='familia'?'btn-primary':'btn-ghost'} btn-sm" data-group-by="familia">Familia</button>

          </div>

  document.getElementById("f-unidad").addEventListener("change",(e)=>{

  });

  // vista previa de imagen al pegar URL

  });

    if(!file) return;
    if(typeof firebase === "undefined" || !firebase.storage){
      showToast("Conecta la sincronización en la nube primero (Configuración).");
      return;
    }
    try{
      showToast("Subiendo foto...");
      const storageRef = firebase.storage().ref().child(`lumobral_productos/${uid("img")}_${file.name}`);
      const snap = await storageRef.put(file);
      const url = await snap.ref.getDownloadURL();
      document.getElementById("f-imagenUrl").value = url;
      document.getElementById("f-imgPreviewWrap").innerHTML = `<img src="${esc(url)}" style="width:100%;height:100%;object-fit:cover;"/>`;
      showToast("Foto subida correctamente.");
    }catch(err){
      showToast("No se pudo subir la foto: "+err.message);
    }
  });

  // categoría / familia (con opción de crear nueva) + SKU automático
  const catSelect = document.getElementById("f-categoria");
  const catOtra = document.getElementById("f-categoriaOtra");
  const famSelect = document.getElementById("f-familia");
  const famOtra = document.getElementById("f-familiaOtra");
  const skuInput = document.getElementById("f-sku");
  let skuManual = false; // si el usuario ya tenía un SKU distinto al patrón, no lo pisamos hasta que cambien cat/familia

  function currentCategoria(){ return catSelect.value==="__otra__" ? catOtra.value.trim() : catSelect.value; }
  function currentFamilia(){ return famSelect.value==="__otra__" ? famOtra.value.trim() : famSelect.value; }
  function refreshSku(){
    const cat = currentCategoria(), fam = currentFamilia();
    if(cat && fam){
      skuInput.value = generateSku(cat, fam, product?product.id:null);
    }
  }
  catSelect.addEventListener("change", ()=>{
    catOtra.style.display = catSelect.value==="__otra__" ? "" : "none";
    refreshSku();
  });
  catOtra.addEventListener("input", refreshSku);
  famSelect.addEventListener("change", ()=>{
    famOtra.style.display = famSelect.value==="__otra__" ? "" : "none";
    refreshSku();
  });
  famOtra.addEventListener("input", refreshSku);
  // si el producto ya tiene categoría y familia al abrir (edición) y el sku está vacío, autogenera de una
  if(!isEdit || !p.sku) refreshSku();

  // calculadora bidireccional: costo + margen % <-> precio de venta
  const costoInput = document.getElementById("f-costo");
  const margenInput = document.getElementById("f-margen");
  const precioInput = document.getElementById("f-precioVenta");
  let calcLock = false;
  function recalcFromMargen(){
    if(calcLock) return;
    const costo = Number(costoInput.value)||0;
    const margen = Number(margenInput.value);
    if(costo>0 && margenInput.value!==""  && margen<100){
      calcLock = true;
      precioInput.value = Math.round(costo/(1-margen/100));
      calcLock = false;
    }
  }
  function recalcFromPrecio(){
    if(calcLock) return;
    const costo = Number(costoInput.value)||0;
    const precio = Number(precioInput.value)||0;
    if(costo>0 && precio>0){
      calcLock = true;
      margenInput.value = Math.round(((precio-costo)/precio)*100);
      calcLock = false;
    }
  }
  costoInput.addEventListener("input", ()=>{ margenInput.value!==""?recalcFromMargen():recalcFromPrecio(); });
  margenInput.addEventListener("input", recalcFromMargen);
  precioInput.addEventListener("input", recalcFromPrecio);

  document.getElementById("saveProduct").onclick = ()=>{
    const nombre = document.getElementById("f-nombre").value.trim();
    if(!nombre){ showToast("El nombre es obligatorio."); return; }
    const categoria = currentCategoria();
    const familia = currentFamilia();
    const payload = {
      id: product ? product.id : uid("pr"),
      nombre,
      sku: document.getElementById("f-sku").value.trim(),
      codigoBarras: document.getElementById("f-codigoBarras").value.trim(),
      marca: document.getElementById("f-marca").value.trim(),
      familia,
      unidad: document.getElementById("f-unidad").value,
      unidadCustom: document.getElementById("f-unidadCustom").value.trim(),
      costo: Number(document.getElementById("f-costo").value)||0,
      precioVenta: Number(document.getElementById("f-precioVenta").value)||0,
      ivaPorcentaje: Number(document.getElementById("f-iva").value)||0,
      stock: Number(document.getElementById("f-stock").value)||0,
      stockMinimo: Number(document.getElementById("f-stockMinimo").value)||0,
      categoria,
      imagenUrl: document.getElementById("f-imagenUrl").value.trim(),
      fichaTecnicaUrl: document.getElementById("f-fichaTecnicaUrl").value.trim(),
      proveedorId: document.getElementById("f-proveedorId").value,
    };
    if(product){
      const stockAnterior = Number(product.stock)||0;
      const deltaManual = payload.stock - stockAnterior;
      payload.movimientosStock = product.movimientosStock || [];
      if(deltaManual !== 0){
        payload.movimientosStock.push({ fecha:new Date().toISOString(), delta:deltaManual, motivo:"Ajuste manual", saldo:payload.stock });
        if(payload.movimientosStock.length > 200) payload.movimientosStock = payload.movimientosStock.slice(-200);
      }
      DATA.products = DATA.products.map(p=> p.id===product.id ? payload : p);
    }
    else{ payload.movimientosStock = payload.stock>0 ? [{ fecha:new Date().toISOString(), delta:payload.stock, motivo:"Stock inicial", saldo:payload.stock }] : []; DATA.products.push(payload); }
    saveData(DATA); closeModal(); render();
    showToast(product ? "Producto actualizado." : "Producto creado.");
  };
}

function searchClientByRut(){
  const rut = window.prompt("Escribe el RUT del cliente (con o sin puntos/guión):", "");
  if(!rut) return;
  const norm = s => String(s||"").replace(/[.\-\s]/g,"").toLowerCase();
  const target = norm(rut);
  const found = DATA.companies.find(c=> norm(c.rut).includes(target) || target.includes(norm(c.rut)));
  if(!found){ showToast(`No se encontró ninguna empresa con RUT "${rut}".`); return; }
  showToast(`Cliente encontrado: ${found.razonSocial}`);
  openQuoteBuilder(null, found.id);
}

let draftItems = [];
let currentEditingQuoteId = null;

function lastPriceForClientProduct(companyId, productId){
  if(!companyId || !productId) return null;
  const matches = [];
  DATA.quotes.forEach(q=>{
    if(q.companyId!==companyId || q.id===currentEditingQuoteId) return;
    q.items.forEach(it=>{ if(it.productId===productId) matches.push({ precio: it.precio, fecha: q.fecha }); });
  });
  if(matches.length===0) return null;
  matches.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return matches[0];
}

function renderItemsTable(){
  const wrap = document.getElementById("itemsWrap");
  wrap.innerHTML = `
    <table class="items-table">
      <thead><tr><th>SKU</th><th>Producto</th><th>Cant.</th><th>U/Vta</th><th>Precio unit.</th><th>Desc. %</th><th>Subtotal</th><th></th></tr></thead>
      <tbody>
        ${draftItems.map((it,i)=>{
          const prod = DATA.products.find(p=>p.id===it.productId);
          const precio = it.precioOverride != null ? it.precioOverride : (prod ? prod.precioVenta : 0);
          const cant = Number(it.cantidad)||0;
          const desc = Number(it.descuentoPct)||0;
          const subtotal = precio*cant*(1-desc/100);
          return `
            <tr data-idx="${i}">
              <td style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);">${prod&&prod.sku?esc(prod.sku):"—"}</td>
              <td><select class="item-product"><option value="">Seleccionar...</option>${DATA.products.map(p=>`<option value="${p.id}" ${p.id===it.productId?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select></td>
              <td><input type="number" class="item-qty" min="0" value="${it.cantidad}"/></td>
              <td style="font-family:'IBM Plex Mono',monospace;font-size:11px;">${prod?esc(unitLabel(prod)):"—"}</td>
              <td>
                <input type="number" class="item-price" min="0" value="${precio}"/>
                ${(()=>{ const lp = prod ? lastPriceForClientProduct(document.getElementById("qb-company")?document.getElementById("qb-company").value:"", prod.id) : null;
                  return lp ? `<div class="hint" style="margin-top:3px;">Últ. a este cliente: ${fmt(lp.precio)} (${fmtDate(lp.fecha)})</div>` : ""; })()}
              </td>
              <td><input type="number" class="item-discount" min="0" max="100" value="${desc}" style="width:56px;"/></td>
              <td style="font-family:'IBM Plex Mono',monospace;white-space:nowrap;">${fmt(subtotal)}</td>
              <td><button class="icon-btn item-remove" title="Quitar">${ICONS.trash}</button></td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll("tbody tr").forEach(tr=>{
    const idx = Number(tr.dataset.idx);
    tr.querySelector(".item-product").addEventListener("change",(e)=>{
      const newProductId = e.target.value;
      const existingIdx = draftItems.findIndex((it,i)=> i!==idx && it.productId===newProductId && newProductId!=="");
      if(existingIdx !== -1){
        const qtyToAdd = Number(draftItems[idx].cantidad)||1;
        draftItems[existingIdx].cantidad = (Number(draftItems[existingIdx].cantidad)||0) + qtyToAdd;
        draftItems.splice(idx,1);
        showToast("Ese producto ya estaba en la cotización — cantidades sumadas en su línea.");
      }else{
        draftItems[idx].productId = newProductId;
        draftItems[idx].precioOverride = null;
      }
      renderItemsTable(); recalcTotals();
    });
    tr.querySelector(".item-qty").addEventListener("input",(e)=>{ draftItems[idx].cantidad = e.target.value; recalcTotals(); updateRowSubtotal(idx); });
    tr.querySelector(".item-price").addEventListener("input",(e)=>{ draftItems[idx].precioOverride = Number(e.target.value)||0; recalcTotals(); updateRowSubtotal(idx); });
    tr.querySelector(".item-discount").addEventListener("input",(e)=>{ draftItems[idx].descuentoPct = Number(e.target.value)||0; recalcTotals(); updateRowSubtotal(idx); });
    tr.querySelector(".item-remove").addEventListener("click",()=>{
      draftItems.splice(idx,1);
      if(draftItems.length===0) draftItems.push({ productId:"", cantidad:1, descuentoPct:0 });
      renderItemsTable(); recalcTotals();
    });
  });
}

function updateRowSubtotal(idx){
  const it = draftItems[idx];
  const prod = DATA.products.find(p=>p.id===it.productId);
  const precio = it.precioOverride != null ? it.precioOverride : (prod ? prod.precioVenta : 0);
  const subtotal = precio * (Number(it.cantidad)||0) * (1-(Number(it.descuentoPct)||0)/100);
  const cell = document.querySelector(`tr[data-idx="${idx}"] td:nth-child(7)`);
  if(cell) cell.textContent = fmt(subtotal);
}

function computeTotals(){
  const descGlobal = Number(document.getElementById("qb-descuentoGlobal")?.value)||0;
  let subtotalItems = 0, costoTotal = 0;
  draftItems.forEach(it=>{
    const prod = DATA.products.find(p=>p.id===it.productId);
    const precio = it.precioOverride != null ? it.precioOverride : (prod ? prod.precioVenta : 0);
    const cant = Number(it.cantidad)||0;
    const desc = Number(it.descuentoPct)||0;
    subtotalItems += precio*cant*(1-desc/100);
    costoTotal += (prod ? prod.costo : 0) * cant;
  });
  const subtotal = subtotalItems * (1-descGlobal/100);
  const iva = Math.round(subtotal*(DATA.settings.ivaRate/100));
  const total = subtotal + iva;
  const utilidad = subtotal - costoTotal;
  const margen = subtotal ? Math.round((utilidad/subtotal)*100) : 0;
  return { subtotal, iva, total, costoTotal, utilidad, margen, descGlobal };
}

function recalcTotals(){
  const { subtotal, iva, total, costoTotal, utilidad, margen, descGlobal } = computeTotals();
  document.getElementById("qbTotals").innerHTML = `
    <div class="line internal"><span>Costo total (interno)</span><span>${fmt(costoTotal)}</span></div>
    <div class="line internal"><span>Utilidad estimada (${margen}%)</span><span>${fmt(utilidad)}</span></div>
    ${descGlobal>0?`<div class="line"><span>Descuento global aplicado</span><span>-${descGlobal}%</span></div>`:''}
    <div class="line"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
    <div class="line"><span>IVA (${DATA.settings.ivaRate}%)</span><span>${fmt(iva)}</span></div>
    <div class="grand"><span>Total</span><span>${fmt(total)}</span></div>
  `;
}

// ============================================================================
// MOTOR DE PDF — dibujo vectorial directo con jsPDF + jspdf-autotable.
//
// Por qué así y no con pdf.html() ni con una imagen (html2canvas):
// - pdf.html() dibuja el texto palabra por palabra recalculando la posición de
//   cada una por separado; eso producía espacios raros junto a guiones/puntos
//   y montos que no calzaban en la columna (el bug que reportó el cliente).
// - Convertir a imagen (lo que se usó como parche anterior) sí queda alineado,
//   pero el texto deja de ser seleccionable/copiable en el PDF.
// - Este motor dibuja cada línea de texto en una sola llamada a pdf.text(), en
//   una posición X/Y fija y conocida de antemano — nunca dos fragmentos de
//   texto que dependen de medirse entre sí para "calzar" uno junto al otro.
//   Esa es la regla de oro para no reintroducir el bug original: un rótulo y
//   su valor pueden ir en columnas separadas (izquierda/derecha) porque cada
//   una tiene su propia coordenada fija, pero nunca "rótulo en negrita" +
//   "valor normal" pegados en la misma línea con la posición del segundo
//   calculada a partir del ancho del primero.
// - La tabla de ítems usa jspdf-autotable, que maneja el salto de página y
//   alineación de columnas de forma nativa y confiable (no reinventamos eso).
// ============================================================================

const PDF_C = {
  teal:[54,69,79], tealDark:[38,47,54], orange:[255,90,0], orangeDark:[180,64,0],
  text:[38,47,54], muted:[92,102,112], mutedLight:[139,147,154],
  border:[218,221,224], warnBg:[255,243,240], warnBorder:[240,201,163], warnText:[138,65,22],
  condBg:[255,246,239], condBorder:[255,199,163],
};

function pdfFont(pdf, style, size, color){
  pdf.setFont("helvetica", style||"normal");
  pdf.setFontSize(size);
  pdf.setTextColor((color||PDF_C.text)[0], (color||PDF_C.text)[1], (color||PDF_C.text)[2]);
}

// Cabecera compartida: barra naranja, logo + datos de Lumobral a la izquierda,
// folio/fecha a la derecha, regla teal debajo. Devuelve el Y donde continuar.
function pdfHeader(pdf, marginPt, pageW, folio, dateLines, startY){
  let y = startY!=null ? startY : marginPt;
  pdf.setFillColor(...PDF_C.orange);
  pdf.rect(marginPt, y, pageW - marginPt*2, 3, "F");
  y += 16;
  let textX = marginPt;
  const logo = DATA.settings.logoUrl;
  if(logo){
    try{
      const type = /image\/jpeg|image\/jpg/i.test(logo) ? "JPEG" : "PNG";
      pdf.addImage(logo, type, marginPt, y, 46, 46);
      textX = marginPt + 58;
    }catch(e){ /* si el logo no se puede decodificar, seguimos sin él */ }
  }
  pdfFont(pdf, "bold", 12, PDF_C.text);
  pdf.text(DATA.settings.razonSocial||"", textX, y+10);
  pdfFont(pdf, "normal", 8.7, PDF_C.muted);
  pdf.text(`RUT ${DATA.settings.rut||""}`, textX, y+23);
  pdf.text(DATA.settings.direccion||"", textX, y+35);
  pdf.text(DATA.settings.correo||"", textX, y+47);

  const rightX = pageW - marginPt;
  pdfFont(pdf, "bold", 16, PDF_C.orange);
  pdf.text(folio, rightX, y+10, { align:"right" });
  pdfFont(pdf, "normal", 8.7, PDF_C.muted);
  let ly = y + 25;
  (dateLines||[]).forEach(line=>{ pdf.text(line, rightX, ly, { align:"right" }); ly += 12; });

  y += 58;
  pdf.setDrawColor(...PDF_C.teal);
  pdf.setLineWidth(1.6);
  pdf.line(marginPt, y, pageW - marginPt, y);
  return y + 18;
}

// Caja de aviso (para Nota de Crédito / Factura interna): fondo claro + texto que envuelve.
function pdfWarningBox(pdf, marginPt, pageW, y, text){
  const x = marginPt, w = pageW - marginPt*2;
  pdfFont(pdf, "normal", 9, PDF_C.warnText);
  const lines = pdf.splitTextToSize(text, w - 24);
  const h = 14 + lines.length*12;
  pdf.setFillColor(...PDF_C.warnBg);
  pdf.setDrawColor(...PDF_C.warnBorder);
  pdf.setLineWidth(1);
  pdf.roundedRect(x, y, w, h, 4, 4, "FD");
  let ty = y + 16;
  lines.forEach(l=>{ pdf.text(l, x+12, ty); ty += 12; });
  return y + h + 14;
}

// Caja de información (cliente/proveedor/condiciones): título opcional en negrita
// arriba, luego líneas de texto plano — cada línea es una sola llamada a texto,
// nunca dos fragmentos pegados en la misma línea.
function pdfInfoBox(pdf, marginPt, pageW, y, opts){
  const x = marginPt, w = pageW - marginPt*2;
  const fontSize = opts.fontSize || 9.3;
  const lineH = fontSize + 4.2;
  const maxW = w - 28;
  const wrapped = [];
  (opts.lines||[]).forEach(raw=>{
    pdfFont(pdf, "normal", fontSize);
    pdf.splitTextToSize(raw, maxW).forEach(p=> wrapped.push(p));
  });
  const titleH = opts.title ? 16 : 0;
  const boxH = 20 + titleH + wrapped.length*lineH;
  pdf.setFillColor(...(opts.bg||[247,248,247]));
  if(opts.border){ pdf.setDrawColor(...opts.border); pdf.setLineWidth(1); pdf.rect(x, y, w, boxH, "FD"); }
  else pdf.rect(x, y, w, boxH, "F");
  if(opts.accent){ pdf.setFillColor(...opts.accent); pdf.rect(x, y, 3.5, boxH, "F"); }
  let ty = y + 18;
  if(opts.title){
    pdfFont(pdf, "bold", 11, opts.titleColor||PDF_C.orange);
    pdf.text(opts.title, x+14, ty);
    ty += titleH;
  }
  pdfFont(pdf, "normal", fontSize, PDF_C.text);
  wrapped.forEach(line=>{ pdf.text(line, x+14, ty); ty += lineH; });
  return y + boxH + 16;
}

// Bloque de totales: rótulo a la izquierda y monto a la derecha en una columna
// fija de ancho conocido — cada texto tiene su propia coordenada, no dependen
// uno del otro. La línea final (grandLine) va en teal y más grande.
function pdfTotals(pdf, marginPt, pageW, y, lines, grandLine){
  const rightX = pageW - marginPt;
  const colW = 230;
  const leftX = rightX - colW;
  let ty = y;
  (lines||[]).forEach(line=>{
    pdfFont(pdf, "normal", 9.5, PDF_C.muted);
    pdf.text(line.label, leftX, ty);
    pdf.text(line.value, rightX, ty, { align:"right" });
    ty += 15;
  });
  pdf.setDrawColor(...PDF_C.teal);
  pdf.setLineWidth(1.3);
  pdf.line(leftX, ty-3, rightX, ty-3);
  ty += 13;
  pdfFont(pdf, "bold", 14.5, PDF_C.teal);
  pdf.text(grandLine.label, leftX, ty);
  pdf.text(grandLine.value, rightX, ty, { align:"right" });
  return ty + 22;
}

function pdfFooter(pdf, pageW, pageH, text){
  pdfFont(pdf, "normal", 8.3, PDF_C.mutedLight);
  pdf.text(text, pageW/2, pageH - 22, { align:"center" });
}

// Dibuja la tabla de ítems con autoTable (maneja salto de página y repetición
// de encabezado por su cuenta — no lo reinventamos a mano).
function pdfItemsTable(pdf, marginPt, y, head, body, rightAlignCols){
  const styles = {};
  (rightAlignCols||[]).forEach(i=>{ styles[i] = { halign:"right" }; });
  pdf.autoTable({
    startY: y,
    margin: { left: marginPt, right: marginPt },
    head: [head],
    body,
    theme: "grid",
    styles: { font:"helvetica", fontSize:8.8, cellPadding:5, textColor: PDF_C.text, lineColor: PDF_C.border, lineWidth: 0.6 },
    headStyles: { fillColor: PDF_C.teal, textColor:[255,255,255], fontStyle:"bold", fontSize:8.3 },
    alternateRowStyles: { fillColor: [250,251,250] },
    columnStyles: styles,
  });
  return pdf.lastAutoTable.finalY + 16;
}

async function downloadQuotePDF(q){
  if(typeof window.jspdf === "undefined"){
    showToast("No se pudo cargar el generador de PDF (requiere conexión a internet la primera vez). Usa 'Imprimir' como alternativa.");
    return;
  }
  showToast("Generando PDF…");
  try{
    const company = DATA.companies.find(c=>c.id===q.companyId);
    const contact = DATA.contacts.find(c=>c.id===q.contactId);
    const obra = DATA.obras.find(o=>o.id===q.obraId);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","pt","letter");
    const marginPt = 40;
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    let y = pdfHeader(pdf, marginPt, pageW, q.folio, [
      `Fecha: ${fmtDate(q.fecha)}`,
      q.validezTipo==="alza_fabrica" ? "Válida hasta alza de fábrica" : `Válida por ${q.validezDias} días`,
    ]);

    const clientLines = [];
    clientLines.push(`${company ? company.razonSocial : "Empresa eliminada"}${company?` — RUT ${company.rut||"—"}`:""}`);
    if(company && company.giro) clientLines.push(company.giro);
    if(company) clientLines.push(`${company.direccion||""}${company.comuna?`, ${company.comuna}`:""}`.trim());
    if(contact) clientLines.push(`Contacto: ${contact.nombre}${contact.cargo?` (${contact.cargo})`:""}${contact.celular||contact.whatsapp?` · Cel/WhatsApp: ${contact.celular||contact.whatsapp}`:""}${contact.correo?` · ${contact.correo}`:""}`);
    if(obra) clientLines.push(`Obra: ${obra.nombre}${obra.direccion?` — ${obra.direccion}`:""}`);
    y = pdfInfoBox(pdf, marginPt, pageW, y, { lines: clientLines, accent: PDF_C.teal });

    const body = q.items.map(it=>[it.sku||"—", it.nombre, String(it.cantidad), it.unidad||"", fmt(it.precio), fmt(it.subtotal)]);
    y = pdfItemsTable(pdf, marginPt, y, ["SKU","Producto","Cant.","U/Vta","Precio unit.","Subtotal"], body, [2,3,4,5]);

    const totalLines = [];
    if(q.descuentoGlobalPct) totalLines.push({ label:"Descuento global", value:`-${q.descuentoGlobalPct}%` });
    totalLines.push({ label:"Subtotal", value: fmt(q.subtotal) });
    totalLines.push({ label:`IVA (${q.ivaRate!=null?q.ivaRate:DATA.settings.ivaRate}%)`, value: fmt(q.iva) });
    y = pdfTotals(pdf, marginPt, pageW, y, totalLines, { label:"Total", value: fmt(q.total) });

    const vigenciaFecha = (()=>{
      const base = new Date(q.fecha);
      const dias = q.validezTipo==="alza_fabrica" ? 30 : (Number(q.validezDias)||30);
      base.setDate(base.getDate()+dias);
      return fmtDate(base.toISOString());
    })();
    const materialPuestoEnLabel = {obra:"Obra sobre camión",fabrica:"Fábrica Proveedor sobre camión",retira:"Retira cliente"}[q.materialPuestoEn] || "Obra sobre camión";
    y = pdfInfoBox(pdf, marginPt, pageW, y, {
      title: "Condiciones",
      bg: PDF_C.condBg, border: PDF_C.condBorder,
      lines: [
        `Condición de pago: ${q.condicionPago || (company && company.condicionPago) || "A convenir"}`,
        `Vigencia: Válido hasta ${vigenciaFecha} o hasta Alza de Fábrica, lo primero que ocurra.`,
        `Disponibilidad de material: ${q.disponibilidadTipo==="dias" ? `${q.disponibilidadDias||0} día${(q.disponibilidadDias||0)===1?"":"s"}` : "Inmediato"}`,
        `Material puesto en: ${materialPuestoEnLabel}`,
        `Datos para transferencia: ${DATA.settings.razonSocial} — RUT ${DATA.settings.rut} — ${DATA.settings.bancoTransferencia}, ${DATA.settings.tipoCuentaTransferencia} N° ${DATA.settings.numeroCuentaTransferencia} — ${DATA.settings.correo}`,
      ],
    });

    if(q.notas){
      pdfFont(pdf, "bold", 9.3, PDF_C.text);
      pdf.text("Notas:", marginPt, y);
      pdfFont(pdf, "normal", 9.3, PDF_C.muted);
      const notaLines = pdf.splitTextToSize(q.notas, pageW - marginPt*2 - 40);
      pdf.text(notaLines, marginPt+40, y);
    }

    pdfFooter(pdf, pageW, pageH, "Lumobral · Tu aliado en la obra — Cotización generada automáticamente");
    pdf.save(`${q.folio}.pdf`);
  }catch(err){
    console.error(err);
    showToast("No se pudo generar el PDF automáticamente. Usa 'Imprimir' y elige 'Guardar como PDF'.");
  }
}

/* ---------------- activities ---------------- */

let activityQuery = "";

function renderActivities(){
  const filtered = DATA.activities.filter(a => (companyName(a.companyId)+a.descripcion).toLowerCase().includes(activityQuery.toLowerCase()))
    .slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
  return `
    ${PageHeader("Seguimiento","Actividades", `${DATA.activities.length} actividades registradas`, `<button class="btn btn-primary" id="newActivityBtn" ${DATA.companies.length===0?"disabled":""}>${ICONS.plus} Registrar actividad</button>`)}
    ${DATA.companies.length===0 ? '<div class="empty">Agrega al menos una empresa antes de registrar una actividad.</div>' : ''}
    <div class="search"><input id="activitySearch" placeholder="Buscar por empresa o contenido..." value="${esc(activityQuery)}"/></div>
    <div class="activity-feed">
      ${filtered.length===0 ? '<div class="empty">No hay actividades registradas.</div>' : filtered.map(a=>`
        <div class="activity-item">
          <div class="activity-tag">${TIPOS_ACTIVIDAD_LABEL[a.tipo]||a.tipo}</div>
          <div style="flex:1;">
            <div class="activity-text"><b>${esc(companyName(a.companyId))}</b> — ${esc(a.descripcion)}</div>
            <div class="activity-meta">${fmtDateTime(a.fecha)}</div>
          </div>
          <button class="icon-btn" aria-label="Eliminar" title="Eliminar" data-del-activity="${a.id}">${ICONS.trash}</button>
        </div>
      `).join("")}
    </div>
  `;
}

function openActivityModal(presetCompanyId){
  document.body.insertAdjacentHTML("beforeend", `
    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><div class="modal-title">Registrar actividad</div><button class="modal-close" id="closeModal">${ICONS.close}</button></div>
        <div class="modal-body">
          <div class="field"><div class="field-label">Empresa</div><select id="f-companyId">${DATA.companies.map(c=>`<option value="${c.id}" ${c.id===presetCompanyId?"selected":""}>${esc(c.razonSocial)}</option>`).join("")}</select></div>
          <div class="field"><div class="field-label">Tipo</div><select id="f-tipo">${TIPOS_ACTIVIDAD.map(t=>`<option value="${t}">${TIPOS_ACTIVIDAD_LABEL[t]}</option>`).join("")}</select></div>
          <div class="field"><div class="field-label">Descripción</div><textarea id="f-descripcion" placeholder="Qué se conversó, acordó o hizo..."></textarea></div>
          <div class="field"><div class="field-label">Próximo seguimiento (opcional)</div><input type="date" id="f-proximoSeguimiento"/><div class="hint">Si lo llenas, aparecerá como recordatorio en el Resumen cuando llegue la fecha.</div></div>
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;"><span></span><div class="right">
          <button class="btn btn-ghost" id="cancelModal">Cancelar</button>
          <button class="btn btn-primary" id="saveActivity">Guardar</button>
        </div></div>
      </div>
    </div>
  `);
  wireModalClose();
  document.getElementById("saveActivity").onclick = ()=>{
    const descripcion = document.getElementById("f-descripcion").value.trim();
    if(!descripcion){ showToast("Describe brevemente la actividad."); return; }
    const companyId = document.getElementById("f-companyId").value;
    // si esta empresa tenía recordatorios pendientes, se consideran atendidos al registrar una nueva actividad
    DATA.activities.forEach(a=>{ if(a.companyId===companyId && a.proximoSeguimiento) a.seguimientoHecho = true; });
    DATA.activities.push({
      id: uid("a"),
      companyId,
      tipo: document.getElementById("f-tipo").value,
      descripcion,
      fecha: new Date().toISOString(),
      proximoSeguimiento: document.getElementById("f-proximoSeguimiento").value || "",
      seguimientoHecho: false,
    });
    saveData(DATA); closeModal(); render(); showToast("Actividad registrada.");
  };
}

/* ---------------- suppliers (proveedores) ---------------- */

let supplierQuery = "";

function renderSuppliers(){
  const filtered = DATA.suppliers.filter(s => (s.nombre+(s.rut||"")).toLowerCase().includes(supplierQuery.toLowerCase()));
  return `
    ${PageHeader("Abastecimiento","Proveedores", `${DATA.suppliers.length} proveedores registrados`, `<button class="btn btn-primary" id="newSupplierBtn">${ICONS.plus} Nuevo proveedor</button>`)}
    <div class="search"><input id="supplierSearch" placeholder="Buscar por nombre o RUT..." value="${esc(supplierQuery)}"/></div>
    <div class="list">
      ${filtered.length===0 ? '<div class="empty">No hay proveedores que coincidan. Prueba otra búsqueda o agrega uno nuevo.</div>' : filtered.map(s=>{
        const contCount = supplierContactsOf(s.id).length;
        const principal = DATA.contacts.find(x=>x.id===s.contactoPrincipalId);
        const cobranza = DATA.contacts.find(x=>x.id===s.contactoCobranzaId);
        return `
        <div class="row-card">
          <div class="row-main">
            <div class="avatar">${esc(s.nombre.slice(0,2).toUpperCase())}</div>
            <div>
              <div class="row-title">${esc(s.nombre)} <span style="color:var(--muted-2);font-weight:400;">· ${esc(s.codigo||'')}</span></div>
              <div class="row-sub">${s.rut?`RUT ${esc(s.rut)} · `:''}${esc(s.giro||"Sin giro")} · ${contCount} contacto${contCount!==1?'s':''}</div>
              ${principal?`<div class="row-sub">Ventas: ${esc(principal.nombre)} ${principal.celular?`· ${esc(principal.celular)}`:''}</div>`:''}
              ${cobranza?`<div class="row-sub">Cobranza: ${esc(cobranza.nombre)} ${cobranza.celular?`· ${esc(cobranza.celular)}`:''}</div>`:''}
              ${s.banco?`<div class="row-sub">${esc(s.banco)} · ${esc(s.tipoCuenta||'')} ${esc(s.numeroCuenta||'')}</div>`:''}
            </div>
          </div>
          <div class="row-actions">
            ${principal&&principal.correo?`<a href="mailto:${esc(principal.correo)}" class="icon-btn" aria-label="${esc(principal.correo)}" title="${esc(principal.correo)}">${ICONS.mail}</a>`:''}
            ${principal&&principal.whatsapp?`<a href="https://wa.me/${onlyDigits(principal.whatsapp)}" target="_blank" class="icon-btn" aria-label="WhatsApp ${esc(principal.whatsapp)}" title="WhatsApp ${esc(principal.whatsapp)}">${ICONS.whatsapp}</a>`:''}
            <button class="icon-btn" aria-label="Ver ficha" data-view-supplier="${s.id}" title="Ver ficha">${ICONS.eye}</button>
            <button class="icon-btn" aria-label="Editar" data-edit-supplier="${s.id}" title="Editar">${ICONS.edit}</button>
            <button class="icon-btn" aria-label="Duplicar" data-dup-supplier="${s.id}" title="Duplicar">${ICONS.copy}</button>
            <button class="icon-btn" aria-label="Eliminar" data-del-supplier="${s.id}" title="Eliminar">${ICONS.trash}</button>
          </div>
        </div>`;
      }).join("")}

  `;
}

function openSupplierModal(supplier){
  const isEdit = !!supplier;
  const s = supplier || { nombre:"", rut:"", giro:"", direccion:"", codigo: generateSupplierCode(),
    banco:"", tipoCuenta:"", numeroCuenta:"", titularCuenta:"", rutTitular:"", correoPago:"", contactoPrincipalId:"", contactoCobranzaId:"", notas:"" };
  const misContactos = isEdit ? supplierContactsOf(s.id) : [];
  document.body.insertAdjacentHTML("beforeend", `
    <div class="overlay" id="overlay">
      <div class="modal wide">
        <div class="modal-head"><div class="modal-title">${isEdit?`Editar proveedor · ${esc(s.codigo||'')}`:`Nuevo proveedor · ${esc(s.codigo)}`}</div><button class="modal-close" id="closeModal">${ICONS.close}</button></div>
        <div class="modal-body">
          <div class="section-label" style="margin-top:0;">Identificación</div>
          <div class="field"><div class="field-label">Nombre / razón social</div><input type="text" id="f-nombre" value="${esc(s.nombre)}" placeholder="Nombre del proveedor"/></div>
          <div class="field-row">
            <div class="field"><div class="field-label">RUT</div><input type="text" id="f-rut" value="${esc(s.rut)}" placeholder="76.400.100-2"/>

            </div>

          </div>
          <div class="field"><div class="field-label">Dirección</div><input type="text" id="f-direccion" value="${esc(s.direccion)}" placeholder="Dirección comercial"/></div>

          <div class="section-label">Contactos (pueden ser varios: distinta zona, ventas, cobranza...)</div>
          ${isEdit ? `
            <div class="field-row">
              <div class="field"><div class="field-label">Contacto principal (ventas / atención)</div>
                <select id="f-contactoPrincipalId">
                  <option value="">Sin definir</option>
                  ${misContactos.map(p=>`<option value="${p.id}" ${p.id===s.contactoPrincipalId?"selected":""}>${esc(p.nombre)} ${p.zona?`— ${esc(p.zona)}`:''}</option>`).join("")}
                </select>
              </div>
              <div class="field"><div class="field-label">Contacto de cobranza / pagos</div>
                <select id="f-contactoCobranzaId">
                  <option value="">Sin definir</option>
                  ${misContactos.map(p=>`<option value="${p.id}" ${p.id===s.contactoCobranzaId?"selected":""}>${esc(p.nombre)}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="hint">${misContactos.length===0 ? 'Este proveedor aún no tiene contactos.' : `${misContactos.length} contacto(s) registrado(s).`} Administra nombres, teléfonos, correos y zonas desde "Contactos" → filtro Proveedores.</div>
            <button type="button" class="btn btn-ghost btn-sm" id="quickAddSupplierContact" style="margin-top:8px;">${ICONS.plus} Agregar contacto a este proveedor</button>
          ` : `<div class="hint">Guarda el proveedor primero; luego podrás agregarle contactos (ventas, cobranza, por zona, etc.) desde aquí o desde "Contactos".</div>`}

          <div class="section-label">Datos bancarios (para pagos y transferencias)</div>
          <div class="field-row">
            <div class="field"><div class="field-label">Banco</div>
              <select id="f-banco">
                <option value="">Selecciona...</option>
                ${BANCOS_CHILE.map(b=>`<option value="${esc(b)}" ${s.banco===b?"selected":""}>${esc(b)}</option>`).join("")}
              </select>
              <input type="text" id="f-bancoOtro" value="${esc(!s.banco || BANCOS_CHILE.includes(s.banco) ? '' : s.banco)}" placeholder="Nombre del banco" style="margin-top:6px;display:${(s.banco && !BANCOS_CHILE.includes(s.banco))?'block':'none'};"/>
            </div>
            <div class="field"><div class="field-label">Tipo de cuenta</div>
              <select id="f-tipoCuenta">
                <option value="">Selecciona...</option>
                ${TIPOS_CUENTA_CHILE.map(t=>`<option value="${esc(t)}" ${s.tipoCuenta===t?"selected":""}>${esc(t)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field"><div class="field-label">Número de cuenta</div><input type="text" id="f-numeroCuenta" value="${esc(s.numeroCuenta)}"/></div>
            <div class="field"><div class="field-label">Correo para comprobantes de pago</div><input type="email" id="f-correoPago" value="${esc(s.correoPago)}" placeholder="pagos@proveedor.cl"/></div>
          </div>
          <div class="field-row">
            <div class="field"><div class="field-label">Titular de la cuenta</div><input type="text" id="f-titularCuenta" value="${esc(s.titularCuenta)}" placeholder="Nombre del titular"/></div>
            <div class="field"><div class="field-label">RUT del titular</div><input type="text" id="f-rutTitular" value="${esc(s.rutTitular)}"/></div>
          </div>

          <div class="field"><div class="field-label">Notas</div><textarea id="f-notas" placeholder="Qué te vende, condiciones, etc.">${esc(s.notas)}</textarea></div>
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;"><span></span><div class="right">
          <button class="btn btn-ghost" id="cancelModal">Cancelar</button>
          <button class="btn btn-primary" id="saveSupplier">${isEdit?"Guardar cambios":"Crear proveedor"}</button>
        </div></div>
      </div>
    </div>
  `);
  wireModalClose();
  if(isEdit){
    const quickAdd = document.getElementById("quickAddSupplierContact");
    if(quickAdd) quickAdd.onclick = ()=>{ closeModal(); openContactModal(null, "proveedor", s.id); };
  }
  const bancoSelect = document.getElementById("f-banco");
  const bancoOtro = document.getElementById("f-bancoOtro");
  if(bancoSelect && bancoOtro){
    bancoSelect.addEventListener("change", ()=>{
      if(bancoSelect.value==="Otro"){ bancoOtro.style.display="block"; bancoOtro.focus(); }
      else{ bancoOtro.style.display="none"; }
    });
  }
  wireRutInput("f-rut", "f-rut-hint");
  document.getElementById("saveSupplier").onclick = ()=>{
    const nombre = document.getElementById("f-nombre").value.trim();
    if(!nombre){ showToast("El nombre es obligatorio."); return; }
    const rutValue = document.getElementById("f-rut").value.trim();
    if(rutValue && !validarRut(rutValue)){ showToast("El RUT ingresado no es válido. Revisa el dígito verificador."); return; }
    const bancoSel = document.getElementById("f-banco").value;
    const bancoFinal = bancoSel==="Otro" ? document.getElementById("f-bancoOtro").value.trim() : bancoSel;
    const payload = {
      id: supplier ? supplier.id : uid("s"),
      codigo: s.codigo || generateSupplierCode(),
      nombre,
      rut: document.getElementById("f-rut").value.trim(),
      giro: document.getElementById("f-giro").value.trim(),
      direccion: document.getElementById("f-direccion").value.trim(),
      contactoPrincipalId: document.getElementById("f-contactoPrincipalId") ? document.getElementById("f-contactoPrincipalId").value : (supplier?supplier.contactoPrincipalId:""),
      contactoCobranzaId: document.getElementById("f-contactoCobranzaId") ? document.getElementById("f-contactoCobranzaId").value : (supplier?supplier.contactoCobranzaId:""),
      banco: bancoFinal,
      tipoCuenta: document.getElementById("f-tipoCuenta").value,
      numeroCuenta: document.getElementById("f-numeroCuenta").value.trim(),
      correoPago: document.getElementById("f-correoPago").value.trim(),
      titularCuenta: document.getElementById("f-titularCuenta").value.trim(),
      rutTitular: document.getElementById("f-rutTitular").value.trim(),
      notas: document.getElementById("f-notas").value.trim(),
    };
    if(supplier){ DATA.suppliers = DATA.suppliers.map(s=> s.id===supplier.id ? payload : s); }
    else{ DATA.suppliers.push(payload); }
    saveData(DATA); closeModal(); render();
    showToast(supplier ? "Proveedor actualizado." : "Proveedor creado.");
  };
}

/* ---------------- rfqs (solicitudes de cotización / abastecimiento a proveedores) ---------------- */

let rfqQuery = "";
let draftRfqItems = [];

function supplierName(id){ const s=DATA.suppliers.find(x=>x.id===id); return s?s.nombre:"—"; }

function rfqRow(r){
  const total = r.recipients.length;
  const enviados = r.recipients.filter(x=>x.estado!=="pendiente").length;
  return `
    <div class="row-card">
      <div class="row-main">
        <div class="avatar">${esc(r.folio.slice(-2))}</div>
        <div>
          <div class="row-title">${esc(r.folio)}</div>
          <div class="row-sub">${fmtDate(r.fecha)} · ${r.items.length} producto${r.items.length!==1?'s':''} · ${enviados}/${total} proveedores contactados</div>
        </div>
      </div>
      <div class="row-actions">
        <button class="icon-btn" aria-label="Ver / enviar" data-view-rfq="${r.id}" title="Ver / enviar">${ICONS.eye}</button>
        <button class="icon-btn" aria-label="Editar" data-edit-rfq="${r.id}" title="Editar">${ICONS.edit}</button>
        <button class="icon-btn" aria-label="Imprimir" data-print-rfq="${r.id}" title="Imprimir">${ICONS.print}</button>
        <button class="icon-btn" aria-label="Eliminar" data-del-rfq="${r.id}" title="Eliminar">${ICONS.trash}</button>
      </div>
    </div>
  `;
}

function renderRfqs(){
  const filtered = DATA.rfqs.filter(r => r.folio.toLowerCase().includes(rfqQuery.toLowerCase())).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  return `
    ${PageHeader("Abastecimiento","Solicitudes a proveedor", `${DATA.rfqs.length} solicitudes de cotización enviadas`,
      `<button class="btn btn-primary" id="newRfqBtn" ${DATA.suppliers.length===0?"disabled":""}>${ICONS.plus} Nueva solicitud</button>`)}
    <div class="empty" style="text-align:left;">Arma una lista de productos que necesitas y pídele precio a varios proveedores. Cada proveedor recibe su propio mensaje por separado — nunca ve a los demás destinatarios.</div>
    ${DATA.suppliers.length===0 ? '<div class="empty">Agrega al menos un proveedor antes de crear una solicitud.</div>' : ''}
    <div class="search"><input id="rfqSearch" placeholder="Buscar por folio..." value="${esc(rfqQuery)}"/></div>
    <div class="list">${filtered.length===0 ? '<div class="empty">No hay solicitudes que coincidan.</div>' : filtered.map(r=>rfqRow(r)).join("")}</div>
  `;
}

function rfqBuilderModal(existingRfq){
  const isEdit = !!existingRfq;
  if(isEdit){
    draftRfqItems = existingRfq.items.map(it=>({ ...it }));
  }else{
    draftRfqItems = [{ productId:"", nombre:"", unidad:"", cantidad:1 }];
  }
  const selectedSupplierIds = isEdit ? existingRfq.recipients.map(r=>r.supplierId) : [];
  return `
    <div class="overlay" id="overlay">
      <div class="modal wide">
        <div class="modal-head"><div class="modal-title">${isEdit?`Editar ${esc(existingRfq.folio)}`:"Nueva solicitud a proveedores"}</div><button class="modal-close" id="closeModal">${ICONS.close}</button></div>
        <div class="modal-body">
          <div class="field-label" style="margin-bottom:8px;">Productos que necesitas cotizar</div>
          <div id="rfqItemsWrap"></div>
          <button class="btn btn-ghost btn-sm" id="addRfqItemBtn" style="margin-top:10px;">${ICONS.plus} Agregar línea</button>

          <div class="field" style="margin-top:18px;">
            <div class="field-label">Notas para el proveedor (plazo de entrega deseado, condiciones, etc.)</div>
            <textarea id="rfq-notas" placeholder="Necesitamos precio y plazo de entrega para estos productos...">${esc(isEdit?existingRfq.notas:"")}</textarea>
          </div>

          <div class="field" style="margin-top:18px;">
            <div class="field-label">¿A qué proveedores quieres pedirles cotización?</div>
            <input type="text" id="rfq-supplierSearch" autocomplete="off" placeholder="Buscar proveedor por nombre o giro..." style="margin-bottom:10px;"/>
            <div class="checklist" id="rfqSupplierList">
              ${DATA.suppliers.map(s=>`
                <div class="checklist-item">
                  <input type="checkbox" class="rfq-supplier-check" id="sup-${s.id}" value="${s.id}" ${selectedSupplierIds.includes(s.id)?"checked":""}/>
                  <label for="sup-${s.id}">${esc(s.nombre)} <span class="sub">${s.giro?`· ${esc(s.giro)}`:''}</span></label>
                </div>
              `).join("")}
            </div>
            <div class="hint">Cada proveedor seleccionado recibirá un mensaje independiente — no se listan entre ellos ni se enteran de que cotizaste con otros. ${isEdit?'Si quitas un proveedor que ya tenía envíos registrados, se perderá ese historial.':''}</div>
          </div>
        </div>
        <div class="modal-foot" style="padding:0 20px 20px;"><span></span><div class="right">
          <button class="btn btn-ghost" id="cancelModal">Cancelar</button>
